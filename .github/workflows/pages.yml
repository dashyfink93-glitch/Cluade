name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/math-education-website-0frsy1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify question generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every generator produces a well-formed question
        run: node tools/verify-questions.mjs 200
      - name: Check the single-file build is reproducible from source
        run: |
          node tools/build-single-file.mjs dist/general-maths-hub.html
          git diff --exit-code -- dist/general-maths-hub.html

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
