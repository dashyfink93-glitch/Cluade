<title>General Maths Hub</title>
<style>
/* ==========================================================================
   General Maths Hub — QCAA General Mathematics Units 3 & 4
   Design tokens, layout and components. No build step, no dependencies.
   ========================================================================== */

/* ---------- Tokens ---------- */
:root {
  --bg: #f4f7f6;
  --bg-alt: #e7eeec;
  --surface: #ffffff;
  --surface-2: #f5faf8;
  --border: #d8e3e0;
  --border-strong: #b9cac6;
  --text: #10201e;
  --text-muted: #4a5f5c;
  --accent: #0e6b62;
  --accent-2: #14808c;
  --accent-soft: #e2efec;
  --accent-text: #0a5049;
  --ok: #2f6b2a;
  --ok-soft: #e7f2e5;
  --warn: #8a5200;
  --warn-soft: #fdf0dc;
  --danger: #a51f1f;
  --danger-soft: #fbe8e8;
  --shadow-sm: 0 1px 2px rgba(19, 23, 34, .06), 0 1px 3px rgba(19, 23, 34, .04);
  --shadow-md: 0 4px 12px rgba(19, 23, 34, .07), 0 2px 4px rgba(19, 23, 34, .04);
  --shadow-lg: 0 18px 40px rgba(19, 23, 34, .10), 0 4px 12px rgba(19, 23, 34, .05);
  --radius: 14px;
  --radius-sm: 9px;
  --radius-lg: 22px;
  --maxw: 1180px;
  /* Two deliberate roles: the platform UI face for chrome and prose, and an
     old-style serif for mathematics, where italic serif variables are the
     typesetting convention. Both resolve locally — the site stays offline-capable. */
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  --font-math: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
               Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #071110;
  --bg-alt: #0c1918;
  --surface: #10201e;
  --surface-2: #162b28;
  --border: #23403c;
  --border-strong: #35564f;
  --text: #e6efed;
  --text-muted: #a2b8b4;
  --accent: #5ccfbe;
  --accent-2: #7bd6dc;
  --accent-soft: #12312d;
  --accent-text: #7edccb;
  --ok: #86cc80;
  --ok-soft: #142a13;
  --warn: #ffc46b;
  --warn-soft: #2e2313;
  --danger: #ff8f8f;
  --danger-soft: #2e1618;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, .45);
  --shadow-lg: 0 20px 46px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* Viewers who have never touched the toggle follow their OS setting. The
   guard lets an explicit light choice win over a dark system preference. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071110;
    --bg-alt: #0c1918;
    --surface: #10201e;
    --surface-2: #162b28;
    --border: #23403c;
    --border-strong: #35564f;
    --text: #e6efed;
    --text-muted: #a2b8b4;
    --accent: #5ccfbe;
    --accent-2: #7bd6dc;
    --accent-soft: #12312d;
    --accent-text: #7edccb;
    --ok: #86cc80;
    --ok-soft: #142a13;
    --warn: #ffc46b;
    --warn-soft: #2e2313;
    --danger: #ff8f8f;
    --danger-soft: #2e1618;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, .45);
    --shadow-lg: 0 20px 46px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-underline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; font-weight: 680; letter-spacing: -.015em; }
h1 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 3rem); }
h2 { font-size: clamp(1.35rem, 1.1rem + 1.1vw, 1.85rem); }
h3 { font-size: 1.15rem; }
h4 { font-size: 1rem; }
p { margin: 0 0 1em; }
a { color: var(--accent-text); text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
ul, ol { margin: 0 0 1em; padding-left: 1.35em; }
li { margin-bottom: .35em; }
small { font-size: .84rem; }
code, kbd { font-family: var(--font-mono); font-size: .88em; }
kbd {
  background: var(--surface-2); border: 1px solid var(--border);
  border-bottom-width: 2px; border-radius: 6px; padding: .1em .45em;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Containers focused programmatically (to move screen-reader position after a
   panel swap) should not paint a ring around the whole region. */
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }

/* ---------- Skip link ---------- */
.skip-link {
  position: absolute; left: 12px; top: -70px; z-index: 200;
  background: var(--accent); color: #fff; padding: .7em 1.2em;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  font-weight: 600; text-decoration: none; transition: top .15s ease;
}
.skip-link:focus { top: 0; }

/* ---------- Layout ---------- */
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }
.section { padding-block: clamp(40px, 6vw, 76px); }
.section--tight { padding-block: clamp(28px, 4vw, 44px); }
/* Follows straight on from the section above it — no doubled gap. */
.section--continue { padding-top: 0; }
.section--alt { background: var(--bg-alt); }
main { min-height: 60vh; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.site-header__inner {
  display: flex; align-items: center; gap: 16px;
  min-height: 64px; flex-wrap: wrap;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 760; letter-spacing: -.03em; font-size: 1.06rem;
  color: var(--text); text-decoration: none; margin-right: auto;
}
.brand__mark {
  display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 32px;
  border-radius: 10px; color: #fff; font-size: .92rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.brand__sub { display: block; font-size: .68rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-muted); line-height: 1.2; }

.nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.nav a {
  color: var(--text-muted); text-decoration: none; font-weight: 570; font-size: .94rem;
  padding: .5em .8em; border-radius: 9px;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"] { color: var(--accent-text); background: var(--accent-soft); }

.theme-toggle {
  display: inline-grid; place-items: center; width: 38px; height: 38px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-muted); cursor: pointer; padding: 0;
}
.theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }
.theme-toggle svg { width: 18px; height: 18px; }

/* Compact two-row header on phones: brand + toggle, then a scrollable nav. */
@media (max-width: 660px) {
  .site-header__inner {
    display: grid; grid-template-columns: 1fr auto;
    align-items: center; row-gap: 2px; min-height: 0; padding-block: 6px;
  }
  .brand { margin-right: 0; font-size: .95rem; gap: 8px; }
  .brand__mark { width: 28px; height: 28px; flex: 0 0 28px; font-size: .85rem; }
  .brand__sub { font-size: .62rem; }
  .theme-toggle { width: 34px; height: 34px; }
  .nav {
    grid-column: 1 / -1; grid-row: 2; flex-wrap: nowrap; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; margin-inline: -6px;
  }
  .theme-toggle { grid-column: 2; grid-row: 1; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; padding: .32em .58em; font-size: .87rem; }
}
[data-theme="dark"] .theme-toggle .icon-sun,
:root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: none; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; padding-block: clamp(48px, 7vw, 92px); }
.hero::before {
  content: ""; position: absolute; inset: -40% -10% auto -10%; height: 130%;
  background:
    radial-gradient(52% 60% at 18% 8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%),
    radial-gradient(46% 56% at 88% 4%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 60%);
  z-index: -1;
}
.hero__grid { display: grid; gap: clamp(28px, 4vw, 52px); grid-template-columns: 1fr; align-items: center; }
@media (min-width: 900px) { .hero__grid { grid-template-columns: 1.15fr .85fr; } }
.hero p.lead { font-size: clamp(1.02rem, .96rem + .5vw, 1.2rem); color: var(--text-muted); max-width: 62ch; }
.hero__actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
  padding: .38em .9em; border-radius: 999px; font-size: .78rem; font-weight: 640;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent-soft); color: var(--accent-text);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: .74em 1.35em; border-radius: 11px; font: inherit; font-weight: 620;
  border: 1px solid transparent; cursor: pointer; text-decoration: none;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; box-shadow: var(--shadow-md);
}
[data-theme="dark"] .btn--primary { color: #05100f; }
.btn--primary:hover { box-shadow: var(--shadow-lg); }
.btn--ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--sm { padding: .48em .9em; font-size: .88rem; border-radius: 9px; }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: clamp(18px, 2.4vw, 26px);
  box-shadow: var(--shadow-sm);
}
.card--pad-lg { padding: clamp(22px, 3vw, 34px); }
/* Grid and flex children default to min-width:auto, which lets a wide table
   stretch its track instead of scrolling. Opt every layout child out of that. */
.grid > *, .explorer > *, .practice-layout > *, .hero__grid > *,
.card, .question-card, .question-card > *, .steps > li, .steps > li > *,
.solution__body, .solution__body > *, .callout > *, .topic-panel, .control-panel > * {
  min-width: 0;
}

.grid { display: grid; gap: 18px; }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

/* Topic cards */
.topic-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.topic-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.topic-card__num {
  font-family: var(--font-mono); font-size: .8rem; font-weight: 700;
  color: var(--accent-text); letter-spacing: .06em;
}
.topic-card h3 { margin: 0; font-size: 1.08rem; }
.topic-card p { margin: 0; color: var(--text-muted); font-size: .92rem; }
.topic-card__meta { margin-top: auto; padding-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Pills / badges ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: .22em .7em;
  border-radius: 999px; font-size: .76rem; font-weight: 640; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
}
.pill--unit { background: var(--accent-soft); color: var(--accent-text);
  border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
.pill--skill { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
.pill--apply { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.pill--challenge { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 32%, transparent); }

/* ---------- Maths typography ---------- */
.math {
  font-family: var(--font-math); font-style: italic; font-size: 1.06em;
  white-space: nowrap; letter-spacing: .01em;
}
/* On narrow screens a long substitution line must wrap rather than push the
   page sideways. Spaces sit around the operators, so breaks land after them,
   and .frac stays intact because it is an inline-grid. */
@media (max-width: 760px) {
  .math { white-space: normal; }
}
.math .op, .math .num-lit { font-style: normal; }
.math sub, .math sup { font-style: normal; font-size: .68em; }
.frac {
  display: inline-grid; vertical-align: middle;
  text-align: center; margin-inline: .2em; font-size: .9em; line-height: 1.2;
}
.frac > .num { border-bottom: 1.2px solid currentColor; padding: 0 .3em .08em; }
.frac > .den { padding: .08em .3em 0; }
.sqrt { border-top: 1.2px solid currentColor; padding: 0 .2em; margin-left: -.1em; }

/* Formula chip shown beside steps */
.formula-chip {
  display: inline-flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: .5em .85em; border-radius: 10px; font-size: .92rem;
  background: var(--accent-soft); border: 1px dashed color-mix(in srgb, var(--accent) 42%, transparent);
  color: var(--text);
}
.formula-chip__label {
  font-size: .68rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent-text); font-style: normal;
}

/* ---------- Callouts ---------- */
.callout {
  border-radius: var(--radius-sm); padding: 14px 16px; margin: 0 0 16px;
  border: 1px solid var(--border); background: var(--surface-2);
}
.callout > :last-child { margin-bottom: 0; }
.callout__title {
  font-weight: 700; font-size: .8rem; letter-spacing: .07em; text-transform: uppercase;
  margin-bottom: .4em; display: flex; align-items: center; gap: 7px;
}
.callout--idea { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.callout--idea .callout__title { color: var(--accent-text); }
.callout--error { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.callout--error .callout__title { color: var(--danger); }
.callout--tip { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.callout--tip .callout__title { color: var(--ok); }
.callout--warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.callout--warn .callout__title { color: var(--warn); }

/* ---------- Tables ---------- */
.table-scroll { overflow-x: auto; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
.table-scroll:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
table { border-collapse: collapse; width: 100%; font-size: .94rem; }
th, td { text-align: left; padding: .62em .8em; border-bottom: 1px solid var(--border); vertical-align: top; }
thead th {
  font-size: .74rem; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 700; border-bottom: 2px solid var(--border-strong);
  background: var(--surface-2);
}
tbody tr:last-child td { border-bottom: none; }
table.numeric td, table.numeric th { text-align: center; }
table.numeric th:first-child, table.numeric td:first-child { text-align: left; }
caption { text-align: left; font-size: .86rem; color: var(--text-muted); padding-bottom: .5em; }

/* ---------- Topic explorer ---------- */
.explorer { display: grid; gap: 26px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 940px) { .explorer { grid-template-columns: 288px 1fr; } }
.topic-nav {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow-sm);
}
@media (min-width: 940px) { .topic-nav { position: sticky; top: 84px; max-height: calc(100vh - 110px); overflow-y: auto; } }
.topic-nav__heading {
  font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  color: var(--text-muted); padding: 6px 10px 10px;
}
.topic-nav ol { list-style: none; margin: 0 0 8px; padding: 0; }
.topic-nav button {
  display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  padding: .55em .7em; border-radius: 9px; border: 0; background: none; cursor: pointer;
  color: var(--text-muted); font: inherit; font-size: .9rem; line-height: 1.4;
}
.topic-nav button:hover { background: var(--surface-2); color: var(--text); }
.topic-nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 640; }
.topic-nav__idx { font-family: var(--font-mono); font-size: .78rem; }
.topic-nav__done { margin-left: auto; font-size: .72rem; font-variant-numeric: tabular-nums; }

.topic-panel > header { margin-bottom: 22px; }
.topic-panel__meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }

.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li { margin: 0; }
.checklist label {
  display: flex; gap: 11px; align-items: flex-start; padding: .55em .7em;
  border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2);
  cursor: pointer; font-size: .93rem;
}
.checklist label:hover { border-color: var(--border-strong); }
.checklist input { margin-top: .28em; width: 17px; height: 17px; accent-color: var(--accent); flex: 0 0 auto; }
.checklist input:checked + span { color: var(--text-muted); text-decoration: line-through; text-decoration-thickness: 1px; }

.knowledge { display: grid; gap: 12px; margin: 0; }
.knowledge > div { border-left: 3px solid var(--border-strong); padding-left: 14px; }
.knowledge dt { font-weight: 680; margin-bottom: .15em; }
.knowledge dd { margin: 0; color: var(--text-muted); font-size: .95rem; }

.steps { counter-reset: step; list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps > li {
  counter-increment: step; position: relative; padding: 14px 16px 14px 52px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
  margin: 0;
}
.steps > li::before {
  content: counter(step); position: absolute; left: 14px; top: 14px;
  width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .steps > li::before { color: #05100f; }
.steps__title { font-weight: 660; margin-bottom: .3em; font-size: .95rem; }
.steps p, .question-prompt p, .knowledge dd { line-height: 1.95; }
.steps p { margin-bottom: .5em; }
.steps > li > :last-child { margin-bottom: 0; }

.answer-box {
  border-radius: var(--radius-sm); padding: 14px 16px;
  background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 34%, transparent);
}
.answer-box__label {
  font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  color: var(--ok); margin-bottom: .25em;
}
.answer-box p { margin: 0; font-size: 1.05rem; font-weight: 620; }

/* ---------- Practice ---------- */
.practice-layout { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 1000px) { .practice-layout { grid-template-columns: 300px 1fr; } }
.control-panel { display: grid; gap: 18px; }
@media (min-width: 1000px) { .control-panel { position: sticky; top: 84px; } }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .fieldset__legend {
  font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-muted);
}
select, input[type="text"], input[type="number"], input[type="search"] {
  font: inherit; padding: .58em .7em; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); width: 100%;
}
select:hover { border-color: var(--accent); }
fieldset { border: 0; margin: 0 0 14px; padding: 0; }
legend { padding: 0; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  position: relative; display: inline-flex;
}
.chip input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span {
  padding: .38em .85em; border-radius: 999px; border: 1px solid var(--border-strong);

/** Seeded, reproducible pseudo-randomness so any generated question can be shared by URL. */

/** mulberry32 — small, fast, good enough for question parameters. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
class Rng {
  constructor(seed) {
    this.seed = seed >>> 0;
    this._next = mulberry32(this.seed);
  }
  /** Float in [0, 1). */
  next() { return this._next(); }
  /** Integer in [min, max] inclusive. */
  int(min, max) { return min + Math.floor(this.next() * (max - min + 1)); }
  /** Multiple of `step` in [min, max]. */
  step(min, max, step) {
    const n = Math.floor((max - min) / step);
    return min + step * this.int(0, n);
  }
  /** Float in [min, max] rounded to dp decimal places. */
  float(min, max, dp = 2) {
    const f = 10 ** dp;
    return Math.round((min + this.next() * (max - min)) * f) / f;
  }
  pick(arr) { return arr[this.int(0, arr.length - 1)]; }
  /** n distinct items from arr, order randomised. */
  sample(arr, n) { return this.shuffle(arr.slice()).slice(0, n); }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  bool(p = 0.5) { return this.next() < p; }
  /** ± 1 */
  sign() { return this.bool() ? 1 : -1; }
}
function randomSeed() {
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    return crypto.getRandomValues(new Uint32Array(1))[0];
  }
  return Math.floor(Math.random() * 0xFFFFFFFF);
}

/** Number, money and maths-markup formatting shared by every generator. */

/** Round half-up away from zero, avoiding the usual binary-float surprises. */
function round(x, dp = 2) {
  const f = 10 ** dp;
  const v = x * f;
  const r = Math.round(Math.abs(v) + Number.EPSILON * Math.abs(v)) * Math.sign(v);
  return r / f;
}

/** Groups the integer part in threes, leaving the decimal part alone. */
function groupInteger(fixed) {
  const [whole, frac] = fixed.split('.');
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return frac ? `${grouped}.${frac}` : grouped;
}

/** Fixed decimals, with thousands separators and a true minus sign. */
function num(x, dp = 2) {
  return groupInteger(round(x, dp).toFixed(dp)).replace(/^-/, '−');
}

/** Trims trailing zeros: 2.50 -> "2.5", 7.00 -> "7". */
function tidy(x, dp = 4) {
  const s = round(x, dp).toFixed(dp).replace(/\.?0+$/, '');
  return (s === '' || s === '-' ? '0' : s).replace(/^-/, '−');
}

/** Currency with the Australian convention used in the syllabus. */
function money(x, dp = 2) {
  const neg = x < 0;
  return (neg ? '−$' : '$') + groupInteger(round(Math.abs(x), dp).toFixed(dp));
}

/** Percentage from a proportion. */
function pct(x, dp = 2) { return `${num(x * 100, dp)}%`; }

/** Inline maths span with a spoken label for screen readers. */
function math(markup, aria) {
  const label = aria ? ` aria-label="${escapeAttr(aria)}"` : '';

}
function frac(numerator, denominator) {
  return `<span class="frac"><span class="num">${numerator}</span><span class="den">${denominator}</span></span>`;

/** Renders a small numeric table. rows is an array of arrays. */
function table(headers, rows, caption) {

  const head = `<thead><tr>${headers.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead>`;

function ordinal(n) {

/** Joins a list in prose: "a, b and c". */
function listSentence(items) {
  if (items.length <= 1) return items[0] || '';
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

/** Kruskal's minimum spanning tree. edges: [{a, b, w}]. Returns {edges, weight}. */
function minimumSpanningTree(vertices, edges) {
  const parent = Object.fromEntries(vertices.map(v => [v, v]));
  const find = v => (parent[v] === v ? v : (parent[v] = find(parent[v])));
  const sorted = edges.slice().sort((x, y) => x.w - y.w || (x.a + x.b).localeCompare(y.a + y.b));
  const chosen = [];
  let weight = 0;
  for (const e of sorted) {
    const ra = find(e.a), rb = find(e.b);
    if (ra === rb) continue;
    parent[ra] = rb;
    chosen.push(e);
    weight += e.w;
    if (chosen.length === vertices.length - 1) break;
  }
  return { edges: chosen, weight };
}

  const adj = {};
  for (const e of edges) {
    (adj[e.a] ||= []).push({ to: e.b, w: e.w });
    (adj[e.b] ||= []).push({ to: e.a, w: e.w });
  }
  const out = [];
  (function walk(v, visited, route, weight) {
    if (v === end) { out.push({ route: route.slice(), weight }); return; }
    for (const nb of adj[v] || []) {
      if (visited.has(nb.to)) continue;
      visited.add(nb.to); route.push(nb.to);
      walk(nb.to, visited, route, weight + nb.w);
      route.pop(); visited.delete(nb.to);
    }
  })(start, new Set([start]), [start], 0);
  return out.sort((a, b) => a.weight - b.weight);
}

/**
 * Critical path analysis on an activity list.
 * activities: [{ name, dur, pred: [names] }]
 * Returns each activity with est, eft, lst, lft, float, plus duration and critical path.
 */
function criticalPath(activities) {
  const byName = Object.fromEntries(activities.map(a => [a.name, { ...a }]));
  const order = topoSort(activities);

  for (const name of order) {
    const a = byName[name];
    a.est = a.pred.length ? Math.max(...a.pred.map(p => byName[p].eft)) : 0;
    a.eft = a.est + a.dur;
  }
  const duration = Math.max(...activities.map(a => byName[a.name].eft));

  const successors = Object.fromEntries(activities.map(a => [a.name, []]));
  for (const a of activities) for (const p of a.pred) successors[p].push(a.name);

  for (const name of order.slice().reverse()) {
    const a = byName[name];
    a.lft = successors[name].length
      ? Math.min(...successors[name].map(s => byName[s].lst))
      : duration;
    a.lst = a.lft - a.dur;
    a.float = a.lst - a.est;
  }

  const critical = order.filter(n => byName[n].float === 0);
  return { activities: order.map(n => byName[n]), duration, critical, byName };
}

function topoSort(activities) {
  const indeg = Object.fromEntries(activities.map(a => [a.name, a.pred.length]));
  const succ = Object.fromEntries(activities.map(a => [a.name, []]));
  for (const a of activities) for (const p of a.pred) succ[p].push(a.name);
  const queue = activities.filter(a => a.pred.length === 0).map(a => a.name).sort();
  const out = [];
  while (queue.length) {
    const n = queue.shift();
    out.push(n);
    for (const s of succ[n]) if (--indeg[s] === 0) queue.push(s);
    queue.sort();
  }
  if (out.length !== activities.length) throw new Error('project network contains a cycle');
  return out;
}

/** Optimal assignment by exhaustive search — correct and fast for the 2×2/3×3 exam cases. */
function bestAssignment(matrix, mode = 'min') {
  const n = matrix.length;
  const idx = [...Array(n).keys()];
  let best = null;
  for (const perm of permutations(idx)) {
    const total = perm.reduce((s, col, row) => s + matrix[row][col], 0);
    const better = best === null || (mode === 'min' ? total < best.total : total > best.total);
    if (better) best = { total, perm: perm.slice() };
  }
  return best;
}
function permutations(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    for (const p of permutations(rest)) out.push([arr[i], ...p]);
  }
  return out;
}

/** Row then column reduction — the opening moves of the Hungarian algorithm. */
function hungarianReduce(matrix) {
  const rowMins = matrix.map(r => Math.min(...r));
  const afterRows = matrix.map((r, i) => r.map(v => v - rowMins[i]));
  const colMins = afterRows[0].map((_, j) => Math.min(...afterRows.map(r => r[j])));
  const afterCols = afterRows.map(r => r.map((v, j) => v - colMins[j]));
  return { rowMins, afterRows, colMins, afterCols };
}

/** localStorage helpers. Every read and write is guarded — storage can be blocked entirely. */

const KEY = 'gm-hub:v1';

function readAll() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function writeAll(data) {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch { return false; }
}
function get(path, fallback) {
  const data = readAll();
  return path in data ? data[path] : fallback;
}
function set(path, value) {
  const data = readAll();
  data[path] = value;
  return writeAll(data);
}
function update(path, fallback, fn) {
  const next = fn(get(path, fallback));
  set(path, next);
  return next;
}
function clearAll() {
  try { localStorage.removeItem(KEY); return true; } catch { return false; }
}

/* ---- Mastery targets ---- */
const mastery = {
  isDone: (topicId, i) => Boolean(get('mastery', {})[`${topicId}:${i}`]),
  toggle(topicId, i, on) {
    return update('mastery', {}, m => ({ ...m, [`${topicId}:${i}`]: on }));
  },
  countFor(topicId, total) {
    const m = get('mastery', {});
    let n = 0;
    for (let i = 0; i < total; i++) if (m[`${topicId}:${i}`]) n++;
    return n;
  },
  all: () => get('mastery', {})
};

/* ---- Practice statistics ---- */
const stats = {
  read: () => get('stats', { attempted: 0, correct: 0, streak: 0, bestStreak: 0, byTopic: {} }),
  record(topicId, wasCorrect) {
    return update('stats', { attempted: 0, correct: 0, streak: 0, bestStreak: 0, byTopic: {} }, s => {
      const t = s.byTopic[topicId] || { attempted: 0, correct: 0 };
      t.attempted++;
      if (wasCorrect) t.correct++;
      const streak = wasCorrect ? s.streak + 1 : 0;
      return {
        attempted: s.attempted + 1,
        correct: s.correct + (wasCorrect ? 1 : 0),
        streak,
        bestStreak: Math.max(s.bestStreak || 0, streak),
        byTopic: { ...s.byTopic, [topicId]: t }
      };
    });
  },
  reset() { set('stats', { attempted: 0, correct: 0, streak: 0, bestStreak: 0, byTopic: {} }); }
};

/* ── assets/js/lib/ui.js ── */
/** Shared UI behaviour: theme, nav state, and a few small render helpers. */



/* ---------------- Theme ---------------- */
const THEME_KEY = 'theme';
function initTheme() {
  const saved = get(THEME_KEY, null);
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.setAttribute('data-theme', saved);
  }
  const btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  const sync = () => {
    const dark = currentTheme() === 'dark';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    btn.setAttribute('aria-pressed', String(dark));
  };
  btn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    set(THEME_KEY, next);
    sync();
  });
  sync();
}

function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/* ---------------- Nav ---------------- */
function markCurrentNav() {
  const here = location.pathname.split('/').pop() || '?p=home';
  document.querySelectorAll('.nav a').forEach(a => {
    const target = a.getAttribute('href').split('/').pop().split('#')[0];
    if (target === here) a.setAttribute('aria-current', 'page');
  });
}

/* ---------------- Render helpers ---------------- */

/** A formula-book entry rendered as an inline chip, linked to the formula sheet. */
function formulaChip(id) {
  const f = FORMULA_BY_ID[id];
  if (!f) return '';
  return `<a class="formula-chip" href="?p=formulas#f-${f.id}">
    <span class="formula-chip__label">Formula book</span>
    <span aria-label="${escapeHtml(f.aria)}">${f.expr}</span>
  </a>`;
}
function tierPill(tier) {
  const label = tier.charAt(0).toUpperCase() + tier.slice(1);
  return `<span class="pill pill--${tier}">${label}</span>`;
}

/** Replaces the contents of `el` and moves focus there for screen-reader users. */
function swapPanel(el, html, { focus = false } = {}) {
  el.innerHTML = html;
  if (focus) {
    el.setAttribute('tabindex', '-1');
    el.focus({ preventScroll: true });
  }
}

/** Debounce for search-as-you-type. */
function debounce(fn, ms = 160) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function announce(message) {
  let live = document.getElementById('sr-announcer');
  if (!live) {
    live = document.createElement('div');
    live.id = 'sr-announcer';
    live.className = 'visually-hidden';
    live.setAttribute('aria-live', 'polite');
    live.setAttribute('aria-atomic', 'true');
    document.body.appendChild(live);
  }
  live.textContent = '';
  setTimeout(() => { live.textContent = message; }, 40);
}
function boot() {
  initTheme();
  markCurrentNav();
}

/** Formats minutes-since-midnight as a 12-hour clock time. */
function clock(mins) {
  const m = ((mins % 1440) + 1440) % 1440;
  const h24 = Math.floor(m / 60), mm = m % 60;
  const suffix = h24 < 12 ? 'am' : 'pm';
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  const label = (h24 === 0 && mm === 0) ? '12:00 am (midnight)' : `${h12}:${String(mm).padStart(2, '0')} ${suffix}`;
  return label;
}
/** Day rollover: returns {dayShift, mins}. */
function shiftClock(mins, deltaMins) {
  const total = mins + deltaMins;
  const dayShift = Math.floor(total / 1440);
  return { dayShift, mins: ((total % 1440) + 1440) % 1440 };
}
function offsetLabel(off) {
  const sign = off < 0 ? '−' : '+';
  const a = Math.abs(off);
  const h = Math.floor(a), m = Math.round((a - h) * 60);
  return `UTC${sign}${h}${m ? ':' + String(m).padStart(2, '0') : ''}`;
}

    id: 'seq-compare', topicId: 'sequences', tier: 'challenge', marks: 4,

      const d = rng.int(8, 20);

      const n = rng.int(8, 14);
      const A = start + (n - 1) * d;

      const bigger = B > A ? 'B' : 'A';
      return {
        prompt: `<p>Two cost models both start at <strong>${start}</strong> units.</p>
                 <ul><li><strong>Model A</strong> rises by ${d} units each period.</li>

                 <p class="mb-0">Determine which is larger at term ${n}, and justify the result.</p>`,

        steps: [
          { t: 'Model A is arithmetic', formulaId: 'arithmetic',
            h: `<p>${math(`t<sub>${n}</sub> <span class="op">=</span> ${start} <span class="op">+</span> (${n} <span class="op">−</span> 1) <span class="op">×</span> ${d} <span class="op">=</span> ${tidy(A)}`, `t sub ${n} equals ${start} plus ${n} minus 1 times ${d} equals ${A}`)}</p>` },
          { t: 'Model B is geometric', formulaId: 'geometric',
            h: `<p>${math(`r <span class="op">=</span> ${tidy(r)}`)}, so ${math(`t<sub>${n}</sub> <span class="op">=</span> ${start} <span class="op">×</span> ${tidy(r)}<sup>${n - 1}</sup> <span class="op">=</span> ${tidy(B)}`, `t sub ${n} equals ${start} times ${r} to the power of ${n - 1} equals ${B}`)}</p>` },
          { t: 'Compare',
            h: `<p>${math(`${tidy(Math.max(A, B))} <span class="op">></span> ${tidy(Math.min(A, B))}`)}, so <strong>Model ${bigger}</strong> is larger at term ${n} by ${math(tidy(round(Math.abs(B - A), 2)))} units.</p>` },
          { t: 'Justify with the structure',
            h: `<p class="mb-0">Model A adds a fixed ${d} units each period, so its graph is a set of discrete points on a straight line. Model B multiplies by ${tidy(r)}, so each increase is larger than the last. Exponential growth eventually overtakes any linear growth — the only question is whether it has done so by term ${n}${bigger === 'A' ? ', and here it has not yet' : ', and here it has'}.</p>` }
        ],
        answer: `Model A = ${tidy(A)}; Model B ≈ ${tidy(B)}. Model ${bigger} is larger at term ${n}.`,
        pitfall: 'Comparing the two at term 1 or term 2 and generalising. Exponential growth starts slowly and then overtakes.',
        check: { type: 'number', value: B, tol: Math.max(0.5, B * 0.002), label: `Model B at term ${n}` }
      };
    }
  }
];

/**
 * Generators for Graphs and networks, and Networks and decision mathematics 1 & 2.
 * Diagrams are drawn as inline SVG (aria-hidden) and always paired with an
 * equivalent table, so nothing depends on being able to see the picture.
 */


/* Fixed layout reused by the weighted-network questions. */
const LAYOUT = { A: [42, 92], B: [150, 26], C: [150, 158], D: [286, 26], E: [286, 158], F: [396, 92] };
const EDGE_SET = [
  ['A', 'B'], ['A', 'C'], ['B', 'C'], ['B', 'D'], ['C', 'D'], ['C', 'E'], ['D', 'F'], ['E', 'F']
];

/** Inline SVG of a weighted undirected network. Decorative — the table carries the data. */
function networkSvg(edges, highlight = []) {
  const hi = new Set(highlight.map(e => [e.a, e.b].sort().join('')));
  const lines = edges.map(e => {
    const [x1, y1] = LAYOUT[e.a], [x2, y2] = LAYOUT[e.b];
    const on = hi.has([e.a, e.b].sort().join(''));
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor"
              stroke-width="${on ? 3.5 : 1.6}" opacity="${on ? 1 : .45}" />
            <rect x="${mx - 13}" y="${my - 11}" width="26" height="19" rx="5"
              fill="var(--surface)" stroke="currentColor" stroke-opacity=".25" />
            <text x="${mx}" y="${my + 3}" text-anchor="middle" font-size="12.5"
              font-weight="700" fill="currentColor">${e.w}</text>`;
  }).join('');
  const nodes = Object.entries(LAYOUT).map(([id, [x, y]]) =>
    `<circle cx="${x}" cy="${y}" r="17" fill="var(--surface)" stroke="currentColor" stroke-width="2" />
     <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="700"
       fill="currentColor">${id}</text>`).join('');
  return `<div style="margin-bottom:10px">
    <svg viewBox="0 0 440 190" width="440" height="190" role="presentation" aria-hidden="true"
      style="max-width:100%;height:auto;color:var(--text)">${lines}${nodes}</svg></div>`;
}

function edgeTable(edges) {
  return table(['Edge', ...edges.map(e => `${e.a}–${e.b}`)], [['Weight', ...edges.map(e => e.w)]]);
}

function randomWeightedNetwork(rng) {
  return EDGE_SET.map(([a, b]) => ({ a, b, w: rng.int(2, 14) }));
}

            h: `<p>Choose zeros so that no two share a row or a column. That gives <strong>${best.perm.map((c, r) => `${names[r]}→Job ${c + 1}`).join(', ')}</strong>.</p>` },
          { t: 'Cost the allocation from the original table',

        ],
        answer: `${best.perm.map((c, r) => `${names[r]}→Job ${c + 1}`).join(', ')}; minimum cost $${best.total}.`,
        pitfall: 'Stopping at the reduced table. The reductions locate the best allocation; the cost is always read from the original figures.',
        check: { type: 'number', value: best.total, tol: 0.01, label: 'minimum total cost ($)', unit: '$' }
      };
    }
  }
];

/* ── assets/js/data/questions/index.js ── */
/**
 * Registry for every question generator.
 *
 * A generator is a pure function of a seeded Rng, so `generate(id, seed)` always
 * rebuilds exactly the same question — which is what makes a question shareable
 * by URL and re-checkable later.
 */
const GENERATORS = [
  ...bivariate1, ...bivariate2, ...timeSeries,
  ...sequences, ...earthGeometry,
  ...finance1, ...finance2,
  ...graphsNetworks, ...networks1, ...networks2
];
const GENERATOR_BY_ID = Object.fromEntries(GENERATORS.map(g => [g.id, g]));
const TIERS = [
  { id: 'skill', label: 'Skill', blurb: 'Single-step recall and substitution. Do these without notes.' },
  { id: 'apply', label: 'Apply', blurb: 'Choose the method, then carry it through. Formula sheet allowed.' },
  { id: 'challenge', label: 'Challenge', blurb: 'Multi-step or interpretive. Treat these as timed exam responses.' }
];

/** Builds the full question for a generator id and seed. */
function generate(generatorId, seed) {
  const g = GENERATOR_BY_ID[generatorId];
  if (!g) throw new Error(`unknown generator: ${generatorId}`);
  const useSeed = (seed ?? randomSeed()) >>> 0;
  const body = g.gen(new Rng(useSeed));
  return {
    generatorId: g.id,
    seed: useSeed,
    topicId: g.topicId,
    tier: g.tier,
    marks: g.marks,
    skill: g.skill,
    shareId: `${g.id}.${useSeed}`,
    ...body
  };
}

/** Generators matching the current filters. */
function filterGenerators({ topics = [], tiers = [] } = {}) {
  return GENERATORS.filter(g =>
    (topics.length === 0 || topics.includes(g.topicId)) &&
    (tiers.length === 0 || tiers.includes(g.tier)));
}

/**
 * Random question honouring the filters.
 * `avoid` keeps the generator from repeating twice in a row when alternatives exist.
 */
function generateRandom({ topics = [], tiers = [], avoid = null, seed = null } = {}) {
  let pool = filterGenerators({ topics, tiers });
  if (pool.length === 0) return null;
  if (pool.length > 1 && avoid) {
    const trimmed = pool.filter(g => g.id !== avoid);
    if (trimmed.length) pool = trimmed;
  }
  const rng = new Rng(seed ?? randomSeed());
  return generate(rng.pick(pool).id, randomSeed());
}

/** Parses "generatorId.seed" back into a question. */
function fromShareId(shareId) {
  if (typeof shareId !== 'string') return null;
  const at = shareId.lastIndexOf('.');
  if (at < 1) return null;
  const id = shareId.slice(0, at);
  const seed = Number(shareId.slice(at + 1));
  if (!GENERATOR_BY_ID[id] || !Number.isFinite(seed)) return null;
  return generate(id, seed);
}

/** Count of generators per topic, for the topic cards. */
function generatorCounts() {
  const out = {};
  for (const g of GENERATORS) out[g.topicId] = (out[g.topicId] || 0) + 1;
  return out;
}

  formulas() {
    /** Formula sheet: renders every entry, with search and section jump links. */




    boot();

    const search = document.getElementById('formula-search');

    document.getElementById('jump-nav').innerHTML = FORMULA_SECTIONS
      .map(s => `<a href="#s-${s.id}">${escapeHtml(s.title)}</a>`).join('');

    function itemHtml(f) {
      const links = f.topics.map(id => {
        const t = TOPIC_BY_ID[id];
        return t ? `<a class="pill" href="?p=topics#${t.id}">${escapeHtml(t.title)}</a>` : '';

      return `<article class="formula-item" id="f-${f.id}">
        <h3 class="formula-item__name">${escapeHtml(f.name)}</h3>
        <p class="formula-item__expr"><span aria-label="${escapeHtml(f.aria)}">${f.expr}</span></p>
        <p class="formula-item__use">${escapeHtml(f.use)}</p>
        ${links ? `<div class="formula-item__links">${links}</div>` : ''}
      </article>`;
    }

    /** Light stemming so "annuity" also finds "annuities" and "graph" finds "graphs". */
    function stem(text) {
      return text.toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .split(/\s+/)
        .filter(Boolean)
        .map(w => w.replace(/ies$/, 'y').replace(/(ses|xes|zes|ches|shes)$/, m => m.slice(0, -2)).replace(/([^s])s$/, '$1'))
        .join(' ');
    }

    function haystack(f) {
      const topics = f.topics.map(id => TOPIC_BY_ID[id]?.title || '').join(' ');
      const section = FORMULA_SECTIONS.find(s => s.id === f.section)?.title || '';
      return stem(`${f.name} ${f.use} ${f.aria} ${section} ${topics}`);
    }

    function render(filter = '') {
      const q = filter.trim();
      const terms = stem(q).split(' ').filter(Boolean);
      const match = f => {
        if (!terms.length) return true;
        const hay = haystack(f);
        return terms.every(t => hay.includes(t));
      };

      let shown = 0;
      const html = FORMULA_SECTIONS.map(sec => {
        const items = FORMULAS.filter(f => f.section === sec.id && match(f));
        if (!items.length) return '';
        shown += items.length;
        return `<section class="formula-section" id="s-${sec.id}">
          <h2>${escapeHtml(sec.title)} <span class="pill">${items.length}</span></h2>
          <p class="text-muted">${escapeHtml(sec.blurb)}</p>
          <div class="formula-list">${items.map(itemHtml).join('')}</div>
        </section>`;
      }).join('');

      root.innerHTML = html || `<p class="lead">No formula matches &ldquo;${escapeHtml(filter)}&rdquo;.
        Try a topic name, or clear the search.</p>`;
      status.textContent = q
        ? `${shown} of ${FORMULAS.length} formulas match "${filter}".`
        : `Showing all ${FORMULAS.length} formulas.`;
    }

    render();
    search.addEventListener('input', debounce(e => render(e.target.value), 150));

    /* Highlight an entry linked to directly, e.g. ?p=formulas#f-annuity-pv */
    function highlightTarget(retry = true) {
      document.querySelectorAll('.formula-item.is-target').forEach(el => el.classList.remove('is-target'));
      const id = location.hash.slice(1);
      if (!id || !id.startsWith('f-')) return;
      const el = document.getElementById(id);
      if (!el) {
        // The entry exists but an active search has filtered it out — clear and retry.
        if (retry && search.value) {
          search.value = '';
          render();
          highlightTarget(false);
        }
        return;
      }
      if (el.classList.contains('formula-item')) {
        el.classList.add('is-target');
        el.scrollIntoView({ block: 'center' });
      }
    }
    window.addEventListener('hashchange', highlightTarget);
    highlightTarget();
  }
};

/* ── dispatcher ──
   Page comes from ?p=; a bare ?q= (a shared question link) implies the
   practice page. Navigation between pages is an ordinary document load of
   this same file, so no client-side router is required. */
const params = new URLSearchParams(location.search);
let pageId = params.get('p');
if (!CONTROLLERS[pageId]) pageId = params.has('q') ? 'practice' : 'home';

document.getElementById('app-header').innerHTML = "<header class=\"site-header\">\n  <div class=\"wrap site-header__inner\">\n    <a class=\"brand\" href=\"?p=home\">\n      <span class=\"brand__mark\" aria-hidden=\"true\">∑</span>\n      <span>General Maths Hub\n        <span class=\"brand__sub\">QCAA Units 3 &amp; 4</span>\n      </span>\n    </a>\n    <nav class=\"nav\" aria-label=\"Main\">\n      <a href=\"?p=home\">Home</a>\n      <a href=\"?p=topics\">Learn</a>\n      <a href=\"?p=practice\">Practise</a>\n      <a href=\"?p=formulas\">Formula sheet</a>\n    </nav>\n    <button class=\"theme-toggle\" type=\"button\" aria-label=\"Switch theme\">\n      <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg>\n      <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/></svg>\n    </button>\n  </div>\n</header>";
document.getElementById('app-main').innerHTML = PAGE_SHELLS[pageId];
document.getElementById('app-footer').innerHTML = "<footer class=\"site-footer\">\n  <div class=\"wrap grid grid--3\">\n    <div>\n      <h2>General Maths Hub</h2>\n      <p>A free, open study site for QCAA General Mathematics Units 3 &amp; 4. No account, no tracking, no cost.</p>\n    </div>\n    <div>\n      <h2>Sections</h2>\n      <ul>\n        <li><a href=\"?p=topics\">Learning topics</a></li>\n        <li><a href=\"?p=practice\">Question generator</a></li>\n        <li><a href=\"?p=formulas\">Formula sheet</a></li>\n      </ul>\n    </div>\n    <div>\n      <h2>Attribution</h2>\n      <p>Formulas and topic structure follow the QCAA General Mathematics 2025 formula book and syllabus.\n        Formula book content: © State of Queensland (QCAA) 2025, licensed\n        <a href=\"https://creativecommons.org/licenses/by/4.0\" rel=\"license noopener\" target=\"_blank\">CC BY 4.0</a>.</p>\n      <p>This is an independent study resource and is not endorsed by or affiliated with the QCAA.</p>\n    </div>\n  </div>\n</footer>";
document.title = PAGE_TITLES[pageId];

CONTROLLERS[pageId]();

/* markCurrentNav() matches on filename, which cannot work here, so mark the
   active link ourselves — after the controller, so this is what sticks. */
for (const a of document.querySelectorAll('.nav a')) {
  a.removeAttribute('aria-current');
  if ((a.getAttribute('href') || '') === '?p=' + pageId) a.setAttribute('aria-current', 'page');
}
</script>
