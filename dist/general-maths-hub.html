<style>
/* ==========================================================================
   General Maths Hub — QCAA General Mathematics Units 3 & 4
   Design tokens, layout and components. No build step, no dependencies.
   ========================================================================== */

/* ---------- Tokens ---------- */
:root {
  --bg: #f4f7f6;
  --bg-alt: #e7eeec;
  --surface: #ffffff;
  --surface-2: #f5faf8;
  --border: #d8e3e0;
  --border-strong: #b9cac6;
  --text: #10201e;
  --text-muted: #4a5f5c;
  --accent: #0e6b62;
  --accent-2: #14808c;
  --accent-soft: #e2efec;
  --accent-text: #0a5049;
  --ochre: #8a5a11;
  --ochre-soft: #f6ecdc;
  --chart-data: #0d6459;
  --chart-context: #9fadaa;
  --ok: #2f6b2a;
  --ok-soft: #e7f2e5;
  --warn: #8a5200;
  --warn-soft: #fdf0dc;
  --danger: #a51f1f;
  --danger-soft: #fbe8e8;
  --shadow-sm: 0 1px 2px rgba(19, 23, 34, .06), 0 1px 3px rgba(19, 23, 34, .04);
  --shadow-md: 0 4px 12px rgba(19, 23, 34, .07), 0 2px 4px rgba(19, 23, 34, .04);
  --shadow-lg: 0 18px 40px rgba(19, 23, 34, .10), 0 4px 12px rgba(19, 23, 34, .05);
  --radius: 14px;
  --radius-sm: 9px;
  --radius-lg: 22px;
  --maxw: 1180px;
  /* Four roles. Fraunces carries the headings and the syllabus numerals, where
     its old-style shapes read as reference book rather than product page.
     Public Sans takes the running text and the interface. Plex Mono handles
     anything that has to line up in a column. The maths keeps a Times-like
     serif, because italic serif variables are the typesetting convention.
     Every stack falls back to a real local face if the webfont never arrives. */
  --font-display: "Fraunces", ui-serif, "Iowan Old Style", Georgia, serif;
  --font: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-math: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
               Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #071110;
  --bg-alt: #0c1918;
  --surface: #10201e;
  --surface-2: #162b28;
  --border: #23403c;
  --border-strong: #35564f;
  --text: #e6efed;
  --text-muted: #a2b8b4;
  --accent: #5ccfbe;
  --accent-2: #7bd6dc;
  --accent-soft: #12312d;
  --accent-text: #7edccb;
  --ochre: #e0b070;
  --ochre-soft: #2c2415;
  --chart-data: #4ec4b2;
  --chart-context: #5b6e6b;
  --ok: #86cc80;
  --ok-soft: #142a13;
  --warn: #ffc46b;
  --warn-soft: #2e2313;
  --danger: #ff8f8f;
  --danger-soft: #2e1618;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, .45);
  --shadow-lg: 0 20px 46px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* Viewers who have never touched the toggle follow their OS setting. The
   guard lets an explicit light choice win over a dark system preference. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071110;
    --bg-alt: #0c1918;
    --surface: #10201e;
    --surface-2: #162b28;
    --border: #23403c;
    --border-strong: #35564f;
    --text: #e6efed;
    --text-muted: #a2b8b4;
    --accent: #5ccfbe;
    --accent-2: #7bd6dc;
    --accent-soft: #12312d;
    --accent-text: #7edccb;
    --ok: #86cc80;
    --ok-soft: #142a13;
    --warn: #ffc46b;
    --warn-soft: #2e2313;
    --danger: #ff8f8f;
    --danger-soft: #2e1618;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, .45);
    --shadow-lg: 0 20px 46px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

/* The `hidden` attribute only sets display:none at UA specificity, so any
   explicit display rule (.btn is inline-flex, .chip-row is flex) silently
   beats it and the element stays visible. Make the attribute authoritative. */
[hidden] { display: none !important; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16.5px;
  line-height: 1.7;
  font-variant-numeric: tabular-nums lining;
  -webkit-font-smoothing: antialiased;
  text-underline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-variation-settings: "SOFT" 0, "WONK" 0;
  line-height: 1.18; margin: 0 0 .5em; font-weight: 600;
  letter-spacing: -.012em; text-wrap: balance;
}
h1 { font-size: clamp(2.1rem, 1.3rem + 3vw, 3.4rem); font-weight: 700; letter-spacing: -.022em; }
h2 { font-size: clamp(1.45rem, 1.15rem + 1.3vw, 2.05rem); }
h3 { font-size: 1.18rem; }
h4 { font-family: var(--font); font-size: 1rem; font-weight: 680; margin: 0 0 .5em; line-height: 1.3; }
p { margin: 0 0 1em; }
a { color: var(--accent-text); text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
ul, ol { margin: 0 0 1em; padding-left: 1.35em; }
li { margin-bottom: .35em; }
small { font-size: .84rem; }
code, kbd { font-family: var(--font-mono); font-size: .88em; }
kbd {
  background: var(--surface-2); border: 1px solid var(--border);
  border-bottom-width: 2px; border-radius: 6px; padding: .1em .45em;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Containers focused programmatically (to move screen-reader position after a
   panel swap) should not paint a ring around the whole region. */
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }

/* ---------- Skip link ---------- */
.skip-link {
  position: absolute; left: 12px; top: -70px; z-index: 200;
  background: var(--accent); color: #fff; padding: .7em 1.2em;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  font-weight: 600; text-decoration: none; transition: top .15s ease;
}
.skip-link:focus { top: 0; }

/* ---------- Layout ---------- */
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }
.section { padding-block: clamp(40px, 6vw, 76px); }
.section--tight { padding-block: clamp(28px, 4vw, 44px); }
/* Follows straight on from the section above it — no doubled gap. */
.section--continue { padding-top: 0; }
.section--alt { background: var(--bg-alt); }
main { min-height: 60vh; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.site-header__inner {
  display: flex; align-items: center; gap: 16px;
  min-height: 64px; flex-wrap: wrap;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 760; letter-spacing: -.03em; font-size: 1.06rem;
  color: var(--text); text-decoration: none; margin-right: auto;
}
.brand__mark {
  display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 32px;
  border-radius: 10px; color: #fff; font-size: .92rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.brand__sub { display: block; font-size: .68rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-muted); line-height: 1.2; }

.nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.nav a {
  color: var(--text-muted); text-decoration: none; font-weight: 570; font-size: .94rem;
  padding: .5em .8em; border-radius: 9px;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a[aria-current="page"] { color: var(--accent-text); background: var(--accent-soft); }

.theme-toggle {
  display: inline-grid; place-items: center; width: 38px; height: 38px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-muted); cursor: pointer; padding: 0;
}
.theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }
.theme-toggle svg { width: 18px; height: 18px; }

/* Compact two-row header on phones: brand + toggle, then a scrollable nav. */
@media (max-width: 660px) {
  .site-header__inner {
    display: grid; grid-template-columns: 1fr auto;
    align-items: center; row-gap: 2px; min-height: 0; padding-block: 6px;
  }
  .brand { margin-right: 0; font-size: .95rem; gap: 8px; }
  .brand__mark { width: 28px; height: 28px; flex: 0 0 28px; font-size: .85rem; }
  .brand__sub { font-size: .62rem; }
  .theme-toggle { width: 34px; height: 34px; }
  .nav {
    grid-column: 1 / -1; grid-row: 2; flex-wrap: nowrap; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; margin-inline: -6px;
  }
  .theme-toggle { grid-column: 2; grid-row: 1; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; padding: .32em .58em; font-size: .87rem; }
}
[data-theme="dark"] .theme-toggle .icon-sun,
:root:not([data-theme="dark"]) .theme-toggle .icon-moon { display: none; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; padding-block: clamp(48px, 7vw, 92px); }
.hero::before {
  content: ""; position: absolute; inset: -40% -10% auto -10%; height: 130%;
  background:
    radial-gradient(52% 60% at 18% 8%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%),
    radial-gradient(46% 56% at 88% 4%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 60%);
  z-index: -1;
}
.hero__grid { display: grid; gap: clamp(28px, 4vw, 52px); grid-template-columns: 1fr; align-items: center; }
@media (min-width: 900px) { .hero__grid { grid-template-columns: 1.15fr .85fr; } }
.hero p.lead { font-size: clamp(1.02rem, .96rem + .5vw, 1.2rem); color: var(--text-muted); max-width: 62ch; }
.hero__actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
  padding: .38em .9em; border-radius: 999px; font-size: .78rem; font-weight: 640;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent-soft); color: var(--accent-text);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: .74em 1.35em; border-radius: 11px; font: inherit; font-weight: 620;
  border: 1px solid transparent; cursor: pointer; text-decoration: none;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; box-shadow: var(--shadow-md);
}
[data-theme="dark"] .btn--primary { color: #05100f; }
.btn--primary:hover { box-shadow: var(--shadow-lg); }
.btn--ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--sm { padding: .48em .9em; font-size: .88rem; border-radius: 9px; }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: clamp(18px, 2.4vw, 26px);
  box-shadow: var(--shadow-sm);
}
.card--pad-lg { padding: clamp(22px, 3vw, 34px); }
/* Grid and flex children default to min-width:auto, which lets a wide table
   stretch its track instead of scrolling. Opt every layout child out of that. */
.grid > *, .explorer > *, .practice-layout > *, .hero__grid > *,
.card, .question-card, .question-card > *, .steps > li, .steps > li > *,
.solution__body, .solution__body > *, .callout > *, .topic-panel, .control-panel > * {
  min-width: 0;
}

.grid { display: grid; gap: 18px; }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

/* Topic cards */
.topic-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.topic-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.topic-card__num {
  font-family: var(--font-mono); font-size: .8rem; font-weight: 700;
  color: var(--accent-text); letter-spacing: .06em;
}
.topic-card h3 { margin: 0; font-size: 1.08rem; }
.topic-card p { margin: 0; color: var(--text-muted); font-size: .92rem; }
.topic-card__meta { margin-top: auto; padding-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Pills / badges ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: .22em .7em;
  border-radius: 999px; font-size: .76rem; font-weight: 640; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
}
.pill--unit { background: var(--accent-soft); color: var(--accent-text);
  border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
.pill--skill { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 32%, transparent); }
.pill--apply { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.pill--challenge { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 32%, transparent); }

/* ---------- Maths typography ---------- */
.math {
  font-family: var(--font-math); font-style: italic; font-size: 1.06em;
  white-space: nowrap; letter-spacing: .01em;
}
/* On narrow screens a long substitution line must wrap rather than push the
   page sideways. Spaces sit around the operators, so breaks land after them,
   and .frac stays intact because it is an inline-grid. */
@media (max-width: 760px) {
  .math { white-space: normal; }
}
.math .op, .math .num-lit { font-style: normal; }
.math sub, .math sup { font-style: normal; font-size: .68em; }
.frac {
  display: inline-grid; vertical-align: middle;
  text-align: center; margin-inline: .2em; font-size: .9em; line-height: 1.2;
}
.frac > .num { border-bottom: 1.2px solid currentColor; padding: 0 .3em .08em; }
.frac > .den { padding: .08em .3em 0; }
.sqrt { border-top: 1.2px solid currentColor; padding: 0 .2em; margin-left: -.1em; }

/* Formula chip shown beside steps */
.formula-chip {
  display: inline-flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: .5em .85em; border-radius: 10px; font-size: .92rem;
  background: var(--accent-soft); border: 1px dashed color-mix(in srgb, var(--accent) 42%, transparent);
  color: var(--text);
}
.formula-chip__label {
  font-size: .68rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent-text); font-style: normal;
}

/* ---------- Callouts ---------- */
.callout {
  border-radius: var(--radius-sm); padding: 14px 16px; margin: 0 0 16px;
  border: 1px solid var(--border); background: var(--surface-2);
}
.callout > :last-child { margin-bottom: 0; }
.callout__title {
  font-weight: 700; font-size: .8rem; letter-spacing: .07em; text-transform: uppercase;
  margin-bottom: .4em; display: flex; align-items: center; gap: 7px;
}
.callout--idea { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.callout--idea .callout__title { color: var(--accent-text); }
.callout--error { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.callout--error .callout__title { color: var(--danger); }
.callout--tip { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.callout--tip .callout__title { color: var(--ok); }
.callout--warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.callout--warn .callout__title { color: var(--warn); }

/* ---------- Tables ---------- */
.table-scroll { overflow-x: auto; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
.table-scroll:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
table { border-collapse: collapse; width: 100%; font-size: .94rem; }
th, td { text-align: left; padding: .62em .8em; border-bottom: 1px solid var(--border); vertical-align: top; }
thead th {
  font-size: .74rem; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 700; border-bottom: 2px solid var(--border-strong);
  background: var(--surface-2);
}
tbody tr:last-child td { border-bottom: none; }
table.numeric td, table.numeric th { text-align: center; }
table.numeric th:first-child, table.numeric td:first-child { text-align: left; }
caption { text-align: left; font-size: .86rem; color: var(--text-muted); padding-bottom: .5em; }

/* ---------- Topic explorer ---------- */
.explorer { display: grid; gap: 26px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 940px) { .explorer { grid-template-columns: 288px 1fr; } }
.topic-nav {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow-sm);
}
@media (min-width: 940px) { .topic-nav { position: sticky; top: 84px; max-height: calc(100vh - 110px); overflow-y: auto; } }
.topic-nav__heading {
  font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  color: var(--text-muted); padding: 6px 10px 10px;
}
.topic-nav ol { list-style: none; margin: 0 0 8px; padding: 0; }
.topic-nav button {
  display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  padding: .55em .7em; border-radius: 9px; border: 0; background: none; cursor: pointer;
  color: var(--text-muted); font: inherit; font-size: .9rem; line-height: 1.4;
}
.topic-nav button:hover { background: var(--surface-2); color: var(--text); }
.topic-nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 640; }
.topic-nav__idx { font-family: var(--font-mono); font-size: .78rem; }
.topic-nav__done { margin-left: auto; font-size: .72rem; font-variant-numeric: tabular-nums; }

.topic-panel > header { margin-bottom: 22px; }
.topic-panel__meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }

.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li { margin: 0; }
.checklist label {
  display: flex; gap: 11px; align-items: flex-start; padding: .55em .7em;
  border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2);
  cursor: pointer; font-size: .93rem;
}
.checklist label:hover { border-color: var(--border-strong); }
.checklist input { margin-top: .28em; width: 17px; height: 17px; accent-color: var(--accent); flex: 0 0 auto; }
.checklist input:checked + span { color: var(--text-muted); text-decoration: line-through; text-decoration-thickness: 1px; }

.knowledge { display: grid; gap: 12px; margin: 0; }
.knowledge > div { border-left: 3px solid var(--border-strong); padding-left: 14px; }
.knowledge dt { font-weight: 680; margin-bottom: .15em; }
.knowledge dd { margin: 0; color: var(--text-muted); font-size: .95rem; }

.steps { counter-reset: step; list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps > li {
  counter-increment: step; position: relative; padding: 14px 16px 14px 52px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
  margin: 0;
}
.steps > li::before {
  content: counter(step); position: absolute; left: 14px; top: 14px;
  width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .steps > li::before { color: #05100f; }
.steps__title { font-weight: 660; margin-bottom: .3em; font-size: .95rem; }
.steps p, .question-prompt p, .knowledge dd { line-height: 1.95; }
.steps p { margin-bottom: .5em; }
.steps > li > :last-child { margin-bottom: 0; }

.answer-box {
  border-radius: var(--radius-sm); padding: 14px 16px;
  background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 34%, transparent);
}
.answer-box__label {
  font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
  color: var(--ok); margin-bottom: .25em;
}
.answer-box p { margin: 0; font-size: 1.05rem; font-weight: 620; }

/* ---------- Practice ---------- */
.practice-layout { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 1000px) { .practice-layout { grid-template-columns: 300px 1fr; } }
.control-panel { display: grid; gap: 18px; }
@media (min-width: 1000px) { .control-panel { position: sticky; top: 84px; } }

.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .fieldset__legend {
  font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-muted);
}
select, input[type="text"], input[type="number"], input[type="search"] {
  font: inherit; padding: .58em .7em; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); width: 100%;
}
select:hover { border-color: var(--accent); }
fieldset { border: 0; margin: 0 0 14px; padding: 0; }
legend { padding: 0; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  position: relative; display: inline-flex;
}
.chip input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span {
  padding: .38em .85em; border-radius: 999px; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: .85rem; font-weight: 600; color: var(--text-muted);
}
.chip input:checked + span {
  background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text);
}
.chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 6px; }
.stat__value { font-size: 1.4rem; font-weight: 740; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat__label { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }

.question-card { display: grid; gap: 18px; }
.question-card__head { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.question-card__head .spacer { margin-left: auto; }
.question-prompt { font-size: 1.1rem; line-height: 1.6; }
.question-prompt > :last-child { margin-bottom: 0; }
.question-id { font-family: var(--font-mono); font-size: .74rem; color: var(--text-muted); }

.answer-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.answer-form .field { margin: 0; flex: 1 1 200px; }
.feedback { font-weight: 620; font-size: .95rem; }
.feedback--right { color: var(--ok); }
.feedback--wrong { color: var(--danger); }

.options { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.options li { margin: 0; }
.options label {
  display: flex; gap: 11px; align-items: flex-start; padding: .7em .85em;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; font-size: .96rem;
}
.options label:hover { border-color: var(--accent); background: var(--surface-2); }
.options input { margin-top: .3em; accent-color: var(--accent); flex: 0 0 auto; }
.options label.is-correct { background: var(--ok-soft); border-color: var(--ok); }
.options label.is-wrong { background: var(--danger-soft); border-color: var(--danger); }

details.solution {
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
}
details.solution > summary {
  cursor: pointer; padding: .8em 1em; font-weight: 640; list-style: none;
  display: flex; align-items: center; gap: 9px; border-radius: var(--radius-sm);
}
details.solution > summary::-webkit-details-marker { display: none; }
details.solution > summary::before {
  content: "▸"; transition: transform .15s ease; color: var(--accent-text); font-size: .9em;
}
details.solution[open] > summary::before { transform: rotate(90deg); }
details.solution > summary:hover { background: var(--surface); }
.solution__body { padding: 0 1em 1em; display: grid; gap: 14px; }

/* ---------- Formula sheet ---------- */
.formula-section { margin-bottom: 34px; scroll-margin-top: 90px; }
.formula-section > h2 {
  display: flex; align-items: center; gap: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--border-strong); margin-bottom: 16px;
}
.formula-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.formula-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 15px 17px; box-shadow: var(--shadow-sm); scroll-margin-top: 90px;
}
.formula-item.is-target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.formula-item__name { font-size: .84rem; font-weight: 700; color: var(--text-muted); margin-bottom: .35em; }
.formula-item__expr { font-size: 1.16rem; margin-bottom: .5em; line-height: 2.1; }
/* Long word-based formulas wrap rather than creating a scroll region that
   keyboard users cannot reach. Fractions stay intact — .frac is inline-grid. */
.formula-item__expr .math { white-space: normal; }
.formula-item__use { font-size: .89rem; color: var(--text-muted); margin: 0; }
.formula-item__links { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

.jump-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.jump-nav a {
  font-size: .84rem; padding: .35em .8em; border-radius: 999px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted);
}
.jump-nav a:hover { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }

/* ---------- Progress bar ---------- */
.progress {
  height: 8px; border-radius: 999px; background: var(--bg-alt);
  overflow: hidden; border: 1px solid var(--border);
}
.progress__bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width .3s ease; }

/* ---------- Steps / how-to numbers ---------- */
.howto { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); counter-reset: howto; list-style: none; padding: 0; }
.howto > li { counter-increment: howto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); margin: 0; }
.howto > li::before {
  content: counter(howto, decimal-leading-zero); display: block; font-family: var(--font-mono);
  font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: 6px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.howto h3 { font-size: 1rem; margin-bottom: .3em; }
.howto p { margin: 0; font-size: .92rem; color: var(--text-muted); }

/* ---------- Footer ---------- */
.site-footer {
  border-top: 1px solid var(--border); background: var(--surface);
  padding-block: 36px; margin-top: 50px; font-size: .9rem; color: var(--text-muted);
}
.site-footer h2 { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--text); }
.site-footer a { color: var(--text-muted); }
.site-footer ul { list-style: none; padding: 0; }

/* ---------- Utilities ---------- */
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.text-muted { color: var(--text-muted); }
.text-center { text-align: center; }
.mb-0 { margin-bottom: 0; }
.mb-1 { margin-bottom: 8px; }
.mb-2 { margin-bottom: 16px; }
.mb-3 { margin-bottom: 26px; }
.mt-2 { margin-top: 16px; }
.mt-3 { margin-top: 26px; }
.flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.divider { height: 1px; background: var(--border); border: 0; margin: 24px 0; }
.lead { font-size: 1.06rem; }
.noscript-note {
  background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn);
  padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 20px;
}
@media print {
  .site-header, .site-footer, .control-panel, .btn, .jump-nav { display: none !important; }
  body { background: #fff; color: #000; }
  details.solution[open] > .solution__body { display: block; }
}

/* ==========================================================================
   Lesson, tutor, exam — components added for the teaching and mock-exam work
   ========================================================================== */

/* ---------- Breadcrumbs and prev/next ---------- */
.crumbs { font-size: .84rem; color: var(--text-muted); margin-bottom: .6em; }
.crumbs a { color: var(--text-muted); }

.prev-next {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--border);
}
.prev-next__link {
  display: flex; flex-direction: column; gap: 3px; padding: 14px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); text-decoration: none; color: inherit;
}
.prev-next__link:hover { border-color: var(--accent); background: var(--surface-2); }
.prev-next__link--next { text-align: right; }
.prev-next__dir {
  font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--accent-text);
}
.prev-next__title { font-weight: 600; font-size: .95rem; }

/* ---------- Tabs ---------- */
.tabs {
  display: flex; gap: 4px; margin: 22px 0 20px; border-bottom: 2px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  font: inherit; font-weight: 620; font-size: .95rem; white-space: nowrap;
  padding: .6em 1em; border: 0; background: none; cursor: pointer; color: var(--text-muted);
  border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 8px 8px 0 0;
}
.tabs button:hover { color: var(--text); background: var(--surface-2); }
.tabs button[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }

/* ---------- Lesson ---------- */
.lesson h3 { margin-top: 30px; }
.lesson h3:first-of-type { margin-top: 22px; }
.lesson__hook {
  font-size: 1.12rem; line-height: 1.7; font-weight: 500;
  border-left: 3px solid var(--accent); padding: 2px 0 2px 18px; margin-bottom: 4px;
}
.lesson__intuition { font-size: 1.02rem; }
.steps--lesson > li { background: var(--surface); }

.misconceptions { display: grid; gap: 14px; }
.misconception {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 15px 17px; background: var(--surface);
}
.misconception p { margin-bottom: .5em; }
.misconception > :last-child { margin-bottom: 0; }
.misconception__tag {
  display: inline-block; font-size: .68rem; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; padding: .12em .5em; border-radius: 5px; margin-right: 7px;
  background: var(--danger-soft); color: var(--danger); vertical-align: 1px;
}
.misconception__tag--ok { background: var(--ok-soft); color: var(--ok); }
.misconception__why { font-size: .9rem; color: var(--text-muted); padding-left: 2px; }

/* ---------- Tutor ---------- */
.tutor {
  margin-top: 30px; padding: 20px; border-radius: var(--radius);
  border: 1px solid var(--border-strong); background: var(--surface-2);
}
.tutor__head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tutor__head h3 { margin: 0; font-size: 1.05rem; }
.tutor__head .btn { margin-left: auto; }
.tutor__note { font-size: .86rem; margin: .5em 0 0; }
.chip-btn {
  font: inherit; font-size: .85rem; padding: .4em .85em; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text-muted); cursor: pointer; text-align: left;
}
.chip-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.tutor__log { display: grid; gap: 12px; margin: 16px 0 0; max-height: 460px; overflow-y: auto; }
.tutor__log:empty { display: none; }
.bubble { padding: 12px 15px; border-radius: var(--radius-sm); font-size: .95rem; }
.bubble > :last-child { margin-bottom: 0; }
.bubble--you {
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
  margin-left: auto; max-width: 85%;
}
.bubble--tutor { background: var(--surface); border: 1px solid var(--border); }
.bubble--tutor ul, .bubble--tutor ol { margin-bottom: .6em; }
.tutor__thinking { color: var(--text-muted); font-style: italic; }
.tutor__form { display: flex; gap: 9px; margin-top: 14px; flex-wrap: wrap; }
.tutor__form input { flex: 1 1 220px; }

/* ---------- Formula sheet additions ---------- */
.pill--derived {
  background: var(--warn-soft); color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 34%, transparent);
}
.pill--page { font-weight: 500; }
.sheet-pages { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.sheet-page { margin: 0; }
.sheet-page img {
  display: block; width: 100%; height: auto; border-radius: var(--radius-sm);
  /* The scan is a white page; keep it on white in both themes rather than inverting it. */
  background: #fff; border: 1px solid var(--border-strong); box-shadow: var(--shadow-md);
}
.sheet-page figcaption { font-size: .84rem; color: var(--text-muted); margin-top: 9px; }

/* ---------- Exam ---------- */
.exam-bar {
  scroll-margin-top: 90px;
  display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  padding: 14px 18px; margin-bottom: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}
.exam-bar > div:first-child { flex: 1 1 220px; }
.exam-bar__label {
  font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: .45em;
}
.exam-bar__timer {
  font-family: var(--font-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums;
  margin: 0; color: var(--text-muted);
}

.palette { display: flex; flex-wrap: wrap; gap: 7px; list-style: none; margin: 0 0 16px; padding: 0; }
.palette li { margin: 0; }
.palette__btn {
  width: 38px; height: 38px; border-radius: 9px; font: inherit; font-weight: 640;
  font-variant-numeric: tabular-nums; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted);
}
.palette__btn:hover { border-color: var(--accent); }
.palette__btn.is-answered { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
.palette__btn.is-current { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Result */
.result {
  scroll-margin-top: 90px;   /* clear the sticky header when scrolled into view */
  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
  padding: 26px; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--border); box-shadow: var(--shadow-md);
}
.result__grade {
  display: grid; place-items: center; min-width: 132px; padding: 18px 24px;
  border-radius: var(--radius); border: 2px solid;
}
.result__grade--good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.result__grade--fair { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.result__grade--poor { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.result__grade-label {
  font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin: 0;
}
.result__grade-value { font-size: 3.2rem; font-weight: 780; line-height: 1.05; margin: 0; letter-spacing: -.03em; }
.result__summary { flex: 1 1 260px; }
.result__summary h2 { margin-bottom: .2em; }

.review { display: grid; gap: 9px; }
.review__item > summary {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  font-weight: 600; font-size: .93rem;
}
.review__item > summary::before { order: -1; }
.review__num { font-family: var(--font-mono); font-weight: 700; }
.review__verdict { font-weight: 700; }
.review__item.is-right .review__verdict { color: var(--ok); }
.review__item.is-wrong .review__verdict { color: var(--danger); }
.review__marks { font-variant-numeric: tabular-nums; color: var(--text-muted); }
.review__topic { color: var(--text-muted); font-weight: 500; margin-left: auto; }
.review__item.is-right { border-left: 3px solid var(--ok); }
.review__item.is-wrong { border-left: 3px solid var(--danger); }

.topic-nav__done.is-complete { color: var(--ok); font-weight: 700; }

@media (max-width: 560px) {
  .prev-next { grid-template-columns: 1fr; }
  .prev-next__link--next { text-align: left; }
  .result__grade-value { font-size: 2.6rem; }
  .review__topic { margin-left: 0; width: 100%; }
}

/* ==========================================================================
   Design pass: quieter surfaces, stronger type, charts
   ========================================================================== */

/* Not everything is a card. Borders carry most separation; shadow is reserved
   for the few things that genuinely sit above the page. */
.card { box-shadow: none; }
.card:where(.card--pad-lg) { box-shadow: var(--shadow-sm); }
.topic-card { box-shadow: none; }
.topic-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

/* Syllabus numbers are a real sequence, so let them read as one. */
.topic-card__num {
  font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-muted); font-weight: 600;
}
.topic-card h3 { font-size: 1.22rem; margin-bottom: .15em; }
.topic-card { gap: 7px; padding: 24px; }

/* The hero leads with type, not with a gradient wash. */
.hero::before { opacity: .55; }
.hero h1 { max-width: 16ch; }
.eyebrow {
  font-family: var(--font-mono); font-size: .72rem; font-weight: 600;
  letter-spacing: .12em; background: transparent; border: 0; padding: 0;
  color: var(--text-muted); margin-bottom: 22px;
}
.eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--accent); display: inline-block; vertical-align: middle; margin-right: 10px; }

/* Reference-book detail: the section heading carries a rule to the margin. */
.section > .wrap > h2 { position: relative; padding-top: 18px; }
.section > .wrap > h2::before {
  content: ""; position: absolute; top: 0; left: 0; width: 42px; height: 3px;
  background: var(--accent); border-radius: 2px;
}

/* Buttons: flatter, with the accent doing the work. */
.btn--primary { background: var(--accent); box-shadow: none; }
.btn--primary:hover { background: var(--accent-text); box-shadow: none; }
[data-theme="dark"] .btn--primary:hover,
:root:not([data-theme="light"]) .btn--primary:hover { background: var(--accent-2); }
.btn { font-weight: 600; letter-spacing: -.005em; }

.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; letter-spacing: -.02em; }
.brand__mark { background: var(--accent); border-radius: 9px; }
.brand__sub { font-family: var(--font-mono); font-weight: 500; }

.nav a { font-weight: 500; }
.pill { font-weight: 600; }
.stat__value { font-family: var(--font-display); font-weight: 700; }
.result__grade-value { font-family: var(--font-display); font-weight: 700; }
.howto > li::before { font-family: var(--font-display); background: none; -webkit-text-fill-color: currentColor; color: var(--accent-text); }
.lesson__hook { font-family: var(--font-display); font-size: 1.24rem; line-height: 1.5; font-weight: 500; border-left-width: 3px; }

/* The ochre is the second voice: used only where something is being annotated. */
.callout--tip { background: var(--ochre-soft); border-color: color-mix(in srgb, var(--ochre) 30%, transparent); }
.callout--tip .callout__title { color: var(--ochre); }
.formula-chip { border-color: color-mix(in srgb, var(--accent) 38%, transparent); }

/* ---------- Charts ---------- */
.chart { margin: 0 0 6px; }
.chart__svg { display: block; width: 100%; max-width: 470px; height: auto; margin-inline: auto; }
.chart__caption {
  font-size: .84rem; color: var(--text-muted); text-align: center; margin-top: 2px; margin-bottom: 10px;
}
.chart__grid { stroke: var(--border); stroke-width: 1; }
.chart__axis { stroke: var(--border-strong); stroke-width: 1.5; }
.chart__tick { fill: var(--text-muted); font-size: 11px; font-family: var(--font-mono); }
.chart__axis-label { fill: var(--text-muted); font-size: 12px; font-weight: 600; font-family: var(--font); }
.chart__dot { fill: var(--chart-data); stroke: var(--surface); stroke-width: 1.5; }
.chart__dot:hover { stroke: var(--text); stroke-width: 2; }
.chart__line { stroke: var(--chart-data); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
/* The fitted line is context, so it is dashed as well as grey: never colour alone. */
.chart__fit { stroke: var(--chart-context); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
.chart__zero { stroke: var(--chart-context); stroke-width: 2; stroke-dasharray: 6 4; }
.chart__series-label { fill: var(--text-muted); font-size: 11px; font-weight: 600; font-family: var(--font); }

/* ---------- Symbol glossary under a formula ---------- */
.symbols { display: grid; gap: 5px; margin: 10px 0 0; font-size: .88rem; }
.symbols > div { display: flex; gap: 9px; align-items: baseline; }
.symbols dt {
  flex: 0 0 auto; min-width: 2.2em; font-family: var(--font-math); font-style: italic;
  font-weight: 600; color: var(--accent-text);
}
.symbols dd { margin: 0; color: var(--text-muted); }
.formula-item__symbols {
  margin-top: 12px; padding-top: 11px; border-top: 1px dashed var(--border-strong);

/** Seeded, reproducible pseudo-randomness so any generated question can be shared by URL. */

/** mulberry32 — small, fast, good enough for question parameters. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
class Rng {
  constructor(seed) {
    this.seed = seed >>> 0;
    this._next = mulberry32(this.seed);
  }
  /** Float in [0, 1). */
  next() { return this._next(); }
  /** Integer in [min, max] inclusive. */
  int(min, max) { return min + Math.floor(this.next() * (max - min + 1)); }
  /** Multiple of `step` in [min, max]. */
  step(min, max, step) {
    const n = Math.floor((max - min) / step);
    return min + step * this.int(0, n);
  }
  /** Float in [min, max] rounded to dp decimal places. */
  float(min, max, dp = 2) {
    const f = 10 ** dp;
    return Math.round((min + this.next() * (max - min)) * f) / f;
  }
  pick(arr) { return arr[this.int(0, arr.length - 1)]; }
  /** n distinct items from arr, order randomised. */
  sample(arr, n) { return this.shuffle(arr.slice()).slice(0, n); }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = this.int(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  bool(p = 0.5) { return this.next() < p; }
  /** ± 1 */
  sign() { return this.bool() ? 1 : -1; }
}
function randomSeed() {
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    return crypto.getRandomValues(new Uint32Array(1))[0];
  }
  return Math.floor(Math.random() * 0xFFFFFFFF);
}

/** Number, money and maths-markup formatting shared by every generator. */

/** Round half-up away from zero, avoiding the usual binary-float surprises. */
function round(x, dp = 2) {
  const f = 10 ** dp;
  const v = x * f;
  const r = Math.round(Math.abs(v) + Number.EPSILON * Math.abs(v)) * Math.sign(v);
  return r / f;
}

/** Groups the integer part in threes, leaving the decimal part alone. */
function groupInteger(fixed) {
  const [whole, frac] = fixed.split('.');
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return frac ? `${grouped}.${frac}` : grouped;
}

/** Fixed decimals, with thousands separators and a true minus sign. */
function num(x, dp = 2) {
  return groupInteger(round(x, dp).toFixed(dp)).replace(/^-/, '−');
}

/** Trims trailing zeros: 2.50 -> "2.5", 7.00 -> "7". */
function tidy(x, dp = 4) {
  const s = round(x, dp).toFixed(dp).replace(/\.?0+$/, '');
  return (s === '' || s === '-' ? '0' : s).replace(/^-/, '−');
}

/** Currency with the Australian convention used in the syllabus. */
function money(x, dp = 2) {
  const neg = x < 0;
  return (neg ? '−$' : '$') + groupInteger(round(Math.abs(x), dp).toFixed(dp));
}

/** Percentage from a proportion. */
function pct(x, dp = 2) { return `${num(x * 100, dp)}%`; }

/** Inline maths span with a spoken label for screen readers. */
function math(markup, aria) {
  const label = aria ? ` aria-label="${escapeAttr(aria)}"` : '';
  return `<span class="math"${label}>${markup}</span>`;
}
function frac(numerator, denominator) {
  return `<span class="frac"><span class="num">${numerator}</span><span class="den">${denominator}</span></span>`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>

/** Renders a small numeric table. rows is an array of arrays. */
function table(headers, rows, caption) {
  const cap = caption ? `<caption>${caption}</caption>` : '';
  const head = `<thead><tr>${headers.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead>`;

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/** Joins a list in prose: "a, b and c". */
function listSentence(items) {
  if (items.length <= 1) return items[0] || '';
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

/* ── assets/js/lib/solvers.js ── */
/**
 * Small exact solvers shared by the network generators, so the published answer
 * is computed rather than hard-coded.
 */

/** Kruskal's minimum spanning tree. edges: [{a, b, w}]. Returns {edges, weight}. */
function minimumSpanningTree(vertices, edges) {
  const parent = Object.fromEntries(vertices.map(v => [v, v]));
  const find = v => (parent[v] === v ? v : (parent[v] = find(parent[v])));
  const sorted = edges.slice().sort((x, y) => x.w - y.w || (x.a + x.b).localeCompare(y.a + y.b));
  const chosen = [];
  let weight = 0;
  for (const e of sorted) {
    const ra = find(e.a), rb = find(e.b);
    if (ra === rb) continue;
    parent[ra] = rb;
    chosen.push(e);
    weight += e.w;
    if (chosen.length === vertices.length - 1) break;
  }
  return { edges: chosen, weight };
}

/** Every simple path between two vertices, with total weight. */
function allPaths(edges, start, end) {
  const adj = {};
  for (const e of edges) {
    (adj[e.a] ||= []).push({ to: e.b, w: e.w });
    (adj[e.b] ||= []).push({ to: e.a, w: e.w });
  }
  const out = [];
  (function walk(v, visited, route, weight) {
    if (v === end) { out.push({ route: route.slice(), weight }); return; }
    for (const nb of adj[v] || []) {
      if (visited.has(nb.to)) continue;
      visited.add(nb.to); route.push(nb.to);
      walk(nb.to, visited, route, weight + nb.w);
      route.pop(); visited.delete(nb.to);
    }
  })(start, new Set([start]), [start], 0);
  return out.sort((a, b) => a.weight - b.weight);
}

/**
 * Critical path analysis on an activity list.
 * activities: [{ name, dur, pred: [names] }]
 * Returns each activity with est, eft, lst, lft, float, plus duration and critical path.
 */
function criticalPath(activities) {
  const byName = Object.fromEntries(activities.map(a => [a.name, { ...a }]));
  const order = topoSort(activities);

  for (const name of order) {
    const a = byName[name];
    a.est = a.pred.length ? Math.max(...a.pred.map(p => byName[p].eft)) : 0;
    a.eft = a.est + a.dur;
  }
  const duration = Math.max(...activities.map(a => byName[a.name].eft));

  const successors = Object.fromEntries(activities.map(a => [a.name, []]));
  for (const a of activities) for (const p of a.pred) successors[p].push(a.name);

  for (const name of order.slice().reverse()) {
    const a = byName[name];
    a.lft = successors[name].length
      ? Math.min(...successors[name].map(s => byName[s].lst))
      : duration;
    a.lst = a.lft - a.dur;
    a.float = a.lst - a.est;
  }

  const critical = order.filter(n => byName[n].float === 0);
  return { activities: order.map(n => byName[n]), duration, critical, byName };
}

function topoSort(activities) {
  const indeg = Object.fromEntries(activities.map(a => [a.name, a.pred.length]));
  const succ = Object.fromEntries(activities.map(a => [a.name, []]));
  for (const a of activities) for (const p of a.pred) succ[p].push(a.name);
  const queue = activities.filter(a => a.pred.length === 0).map(a => a.name).sort();
  const out = [];
  while (queue.length) {
    const n = queue.shift();
    out.push(n);
    for (const s of succ[n]) if (--indeg[s] === 0) queue.push(s);
    queue.sort();
  }
  if (out.length !== activities.length) throw new Error('project network contains a cycle');
  return out;
}

/** Optimal assignment by exhaustive search — correct and fast for the 2×2/3×3 exam cases. */
function bestAssignment(matrix, mode = 'min') {
  const n = matrix.length;
  const idx = [...Array(n).keys()];
  let best = null;
  for (const perm of permutations(idx)) {
    const total = perm.reduce((s, col, row) => s + matrix[row][col], 0);
    const better = best === null || (mode === 'min' ? total < best.total : total > best.total);
    if (better) best = { total, perm: perm.slice() };
  }
  return best;
}
function permutations(arr) {
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    for (const p of permutations(rest)) out.push([arr[i], ...p]);
  }
  return out;
}

/** Row then column reduction — the opening moves of the Hungarian algorithm. */
function hungarianReduce(matrix) {
  const rowMins = matrix.map(r => Math.min(...r));
  const afterRows = matrix.map((r, i) => r.map(v => v - rowMins[i]));
  const colMins = afterRows[0].map((_, j) => Math.min(...afterRows.map(r => r[j])));
  const afterCols = afterRows.map(r => r.map((v, j) => v - colMins[j]));
  return { rowMins, afterRows, colMins, afterCols };
}

/**
 * Charts for question prompts: scatterplots, time series and residual plots.
 *
 * Form follows the data's job. A scatterplot shows the relationship between two
 * numerical variables; a line shows change over time. Both use emphasis rather
 * than a categorical palette: the observed data carries the accent colour, and
 * any fitted or trend line is a recessive dashed grey with its own label, so the
 * two are told apart by shape and dash as well as hue.
 *
 * Colours come from CSS custom properties, so each theme gets its own chosen
 * steps rather than an automatic flip. Every chart ships with the same numbers
 * as a table, which is both the accessible form and the relief the low-contrast
 * context grey requires.
 */

const W = 470, H = 300;
const M = { top: 20, right: 18, bottom: 46, left: 58 };
const PLOT_W = W - M.left - M.right;
const PLOT_H = H - M.top - M.bottom;

/** Rounded tick steps: 1, 2, 2.5 or 5 times a power of ten. */
function niceTicks(min, max, target = 5) {
  if (max === min) { max = min + 1; }
  const raw = (max - min) / target;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].find(m => raw <= m * mag) * mag;
  const start = Math.floor(min / step) * step;
  const ticks = [];
  for (let v = start; v <= max + step / 2; v += step) ticks.push(round(v, 6));
  return ticks;
}

function scale(domainMin, domainMax, rangeMin, rangeMax) {
  const span = domainMax - domainMin || 1;
  return v => rangeMin + ((v - domainMin) / span) * (rangeMax - rangeMin);
}

function axes(xTicks, yTicks, xs, ys, xLabel, yLabel) {
  const grid = [
    ...yTicks.map(t => `<line x1="${M.left}" y1="${ys(t)}" x2="${M.left + PLOT_W}" y2="${ys(t)}" class="chart__grid" />`),
    ...xTicks.map(t => `<line x1="${xs(t)}" y1="${M.top}" x2="${xs(t)}" y2="${M.top + PLOT_H}" class="chart__grid" />`)
  ].join('');

  const xLabels = xTicks.map(t =>
    `<text x="${xs(t)}" y="${M.top + PLOT_H + 18}" text-anchor="middle" class="chart__tick">${tidy(t)}</text>`).join('');
  const yLabels = yTicks.map(t =>
    `<text x="${M.left - 9}" y="${ys(t) + 4}" text-anchor="end" class="chart__tick">${tidy(t)}</text>`).join('');

  return `${grid}
    <line x1="${M.left}" y1="${M.top}" x2="${M.left}" y2="${M.top + PLOT_H}" class="chart__axis" />
    <line x1="${M.left}" y1="${M.top + PLOT_H}" x2="${M.left + PLOT_W}" y2="${M.top + PLOT_H}" class="chart__axis" />
    ${xLabels}${yLabels}
    <text x="${M.left + PLOT_W / 2}" y="${H - 6}" text-anchor="middle" class="chart__axis-label">${xLabel}</text>
    <text x="14" y="${M.top + PLOT_H / 2}" text-anchor="middle" class="chart__axis-label"
      transform="rotate(-90 14 ${M.top + PLOT_H / 2})">${yLabel}</text>`;
}

function frame(inner, title) {
  return `<figure class="chart">
    <svg viewBox="0 0 ${W} ${H}" class="chart__svg" role="img" aria-label="${title}. The same values are in the table below.">
      ${inner}
    </svg>
    <figcaption class="chart__caption">${title}</figcaption>
  </figure>`;
}

/**
 * Scatterplot of paired data, optionally with a fitted line.
 * points: [{x, y}]   line: {m, c, label} or null
 */
function scatterPlot({ points, xLabel, yLabel, title, line = null, showTable = true }) {
  const xsVals = points.map(p => p.x);
  const ysVals = points.map(p => p.y);
  const xTicks = niceTicks(Math.min(...xsVals), Math.max(...xsVals));
  const yTicks = niceTicks(Math.min(...ysVals, line ? line.m * Math.min(...xsVals) + line.c : Infinity),
                           Math.max(...ysVals, line ? line.m * Math.max(...xsVals) + line.c : -Infinity));
  const xs = scale(xTicks[0], xTicks[xTicks.length - 1], M.left, M.left + PLOT_W);
  const ys = scale(yTicks[0], yTicks[yTicks.length - 1], M.top + PLOT_H, M.top);

  let fitted = '';
  if (line) {
    const x1 = xTicks[0], x2 = xTicks[xTicks.length - 1];
    fitted = `<line x1="${xs(x1)}" y1="${ys(line.m * x1 + line.c)}"
                    x2="${xs(x2)}" y2="${ys(line.m * x2 + line.c)}"
                    class="chart__fit" />
      <text x="${M.left + PLOT_W - 4}" y="${ys(line.m * x2 + line.c) - 8}" text-anchor="end"
        class="chart__series-label">${line.label || 'line of best fit'}</text>`;
  }

  const marks = points.map(p =>
    `<circle cx="${xs(p.x)}" cy="${ys(p.y)}" r="5" class="chart__dot">
       <title>${xLabel} ${tidy(p.x)}, ${yLabel} ${tidy(p.y)}</title>
     </circle>`).join('');

  const svg = frame(`${axes(xTicks, yTicks, xs, ys, xLabel, yLabel)}${fitted}${marks}`, title);
  const tbl = showTable
    ? table([xLabel, ...points.map(p => tidy(p.x))], [[yLabel, ...points.map(p => tidy(p.y))]])
    : '';
  return svg + tbl;
}

/**
 * Time series line, optionally with a second recessive series (trend or
 * deseasonalised values) drawn dashed and labelled.
 * values: [number]   labels: [string]   trend: {values, label} or null
 */
function timeSeriesPlot({ values, labels, xLabel, yLabel, title, trend = null, showTable = true }) {
  const all = trend ? [...values, ...trend.values] : values;
  const yTicks = niceTicks(Math.min(...all), Math.max(...all));
  const xs = scale(0, values.length - 1, M.left, M.left + PLOT_W);
  const ys = scale(yTicks[0], yTicks[yTicks.length - 1], M.top + PLOT_H, M.top);

  const xTickVals = values.map((_, i) => i);
  const grid = yTicks.map(t =>
    `<line x1="${M.left}" y1="${ys(t)}" x2="${M.left + PLOT_W}" y2="${ys(t)}" class="chart__grid" />`).join('');
  const xLabelsEls = labels.map((l, i) =>
    `<text x="${xs(i)}" y="${M.top + PLOT_H + 18}" text-anchor="middle" class="chart__tick">${l}</text>`).join('');
  const yLabelsEls = yTicks.map(t =>
    `<text x="${M.left - 9}" y="${ys(t) + 4}" text-anchor="end" class="chart__tick">${tidy(t)}</text>`).join('');

  const path = values.map((v, i) => `${i ? 'L' : 'M'}${xs(i)},${ys(v)}`).join(' ');
  const dots = values.map((v, i) =>
    `<circle cx="${xs(i)}" cy="${ys(v)}" r="4.5" class="chart__dot">
       <title>${labels[i]}: ${tidy(v)}</title>
     </circle>`).join('');

  let trendEls = '';
  if (trend) {
    const tp = trend.values.map((v, i) => `${i ? 'L' : 'M'}${xs(i)},${ys(v)}`).join(' ');
    const last = trend.values[trend.values.length - 1];
    trendEls = `<path d="${tp}" class="chart__fit" fill="none" />
      <text x="${M.left + PLOT_W - 4}" y="${ys(last) - 9}" text-anchor="end"
        class="chart__series-label">${trend.label}</text>`;
  }

  const inner = `${grid}
    <line x1="${M.left}" y1="${M.top}" x2="${M.left}" y2="${M.top + PLOT_H}" class="chart__axis" />
    <line x1="${M.left}" y1="${M.top + PLOT_H}" x2="${M.left + PLOT_W}" y2="${M.top + PLOT_H}" class="chart__axis" />
    ${xLabelsEls}${yLabelsEls}
    <text x="${M.left + PLOT_W / 2}" y="${H - 6}" text-anchor="middle" class="chart__axis-label">${xLabel}</text>
    <text x="14" y="${M.top + PLOT_H / 2}" text-anchor="middle" class="chart__axis-label"
      transform="rotate(-90 14 ${M.top + PLOT_H / 2})">${yLabel}</text>
    ${trendEls}
    <path d="${path}" class="chart__line" fill="none" />
    ${dots}`;

  const svg = frame(inner, title);
  const rows = [[yLabel, ...values.map(v => tidy(v))]];
  if (trend) rows.push([trend.label, ...trend.values.map(v => tidy(v))]);
  const tbl = showTable ? table([xLabel, ...labels], rows) : '';
  return svg + tbl;
}

/** Residual plot: residuals against x, with the zero line emphasised. */
function residualPlot({ points, xLabel, title, showTable = true }) {
  const xsVals = points.map(p => p.x);
  const rs = points.map(p => p.r);
  const bound = Math.max(Math.abs(Math.min(...rs)), Math.abs(Math.max(...rs)));
  const xTicks = niceTicks(Math.min(...xsVals), Math.max(...xsVals));
  const yTicks = niceTicks(-bound, bound, 4);
  const xs = scale(xTicks[0], xTicks[xTicks.length - 1], M.left, M.left + PLOT_W);
  const ys = scale(yTicks[0], yTicks[yTicks.length - 1], M.top + PLOT_H, M.top);

  const zero = `<line x1="${M.left}" y1="${ys(0)}" x2="${M.left + PLOT_W}" y2="${ys(0)}" class="chart__zero" />
    <text x="${M.left + PLOT_W - 4}" y="${ys(0) - 8}" text-anchor="end" class="chart__series-label">residual = 0</text>`;
  const marks = points.map(p =>
    `<circle cx="${xs(p.x)}" cy="${ys(p.r)}" r="5" class="chart__dot">
       <title>${xLabel} ${tidy(p.x)}, residual ${tidy(p.r)}</title>
     </circle>`).join('');

  const svg = frame(`${axes(xTicks, yTicks, xs, ys, xLabel, 'residual')}${zero}${marks}`, title);
  const tbl = showTable
    ? table([xLabel, ...points.map(p => tidy(p.x))], [['residual', ...points.map(p => tidy(p.r))]])
    : '';
  return svg + tbl;
}

/** A percentaged two-way table, rendered as a real table rather than a chart. */
function twoWayTable({ evName, groups, yesLabel, noLabel }) {
  const headers = ['', yesLabel, noLabel, 'Total'];
  const rows = groups.map(g => [g.name, g.yes, g.no, g.yes + g.no]);
  const totals = ['Total',
    groups.reduce((n, g) => n + g.yes, 0),
    groups.reduce((n, g) => n + g.no, 0),
    groups.reduce((n, g) => n + g.yes + g.no, 0)];
  return table(headers, [...rows, totals], `Counts by ${evName}`);
}

/** localStorage helpers. Every read and write is guarded — storage can be blocked entirely. */

const KEY = 'gm-hub:v1';

function readAll() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function writeAll(data) {
  try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
  catch { return false; }
}
function get(path, fallback) {
  const data = readAll();
  return path in data ? data[path] : fallback;
}
function set(path, value) {
  const data = readAll();
  data[path] = value;
  return writeAll(data);
}
function update(path, fallback, fn) {
  const next = fn(get(path, fallback));
  set(path, next);
  return next;
}
function clearAll() {
  try { localStorage.removeItem(KEY); return true; } catch { return false; }
}

/* ---- Mastery targets ---- */
const mastery = {
  isDone: (topicId, i) => Boolean(get('mastery', {})[`${topicId}:${i}`]),
  toggle(topicId, i, on) {
    return update('mastery', {}, m => ({ ...m, [`${topicId}:${i}`]: on }));
  },
  countFor(topicId, total) {
    const m = get('mastery', {});
    let n = 0;
    for (let i = 0; i < total; i++) if (m[`${topicId}:${i}`]) n++;
    return n;
  },
  all: () => get('mastery', {})
};

/* ---- Practice statistics ---- */
const stats = {
  read: () => get('stats', { attempted: 0, correct: 0, streak: 0, bestStreak: 0, byTopic: {} }),
  record(topicId, wasCorrect) {
    return update('stats', { attempted: 0, correct: 0, streak: 0, bestStreak: 0, byTopic: {} }, s => {
      const t = s.byTopic[topicId] || { attempted: 0, correct: 0 };
      t.attempted++;
      if (wasCorrect) t.correct++;
      const streak = wasCorrect ? s.streak + 1 : 0;
      return {
        attempted: s.attempted + 1,
        correct: s.correct + (wasCorrect ? 1 : 0),
        streak,
        bestStreak: Math.max(s.bestStreak || 0, streak),
        byTopic: { ...s.byTopic, [topicId]: t }
      };
    });
  },
  reset() { set('stats', { attempted: 0, correct: 0, streak: 0, bestStreak: 0, byTopic: {} }); }
};

  'bivariate-1': {
    hook: 'A school says its new tutoring program works, because 80% of the students who went to it passed. That number on its own tells you nothing. Working out why is this whole topic.',

      You only ever ask one question: <em>if I know one, do I know anything about the other?</em>

    board: [
      { t: 'First, what kind of thing is each one?', h: `Ask yourself: could I take an average of this and have it mean something? Average height, sure. Average income, sure. Those are numerical. Average eye colour makes no sense. Average postcode makes no sense either, even though postcodes are written with digits. Those are categorical, which is a long word for "it's a label, not a quantity."` },
      { t: 'Then, which one is doing the explaining?', h: `Pick the one you think is causing the change. That is the explanatory variable. The other one is the response. If you think tutoring changes results, tutoring explains and results respond. You have not proved anything yet. You are just deciding which way round to look at it.` },
      { t: 'Two labels? Compare percentages inside each group', h: `Here is the bit almost everyone gets wrong. Go back to that 80% pass rate. It means nothing until you ask the obvious follow-up: what percentage of the students who <em>did not</em> go to tutoring passed? If that answer is 78%, the program did nothing at all. You need both numbers, and you work each one out inside its own group.` },
      { t: 'Two numbers? Draw the picture first', h: `Plot the points and look at them. Does the cloud slope up or down? Is it a straight line or a curve? Are the points packed tight or sprayed all over? Do this before you touch r, because r only knows about straight lines. Data shaped like a smile can give you r near zero, and if you trusted that number you would report "no pattern" about a picture with an obvious pattern in it.` },
      { t: 'Now you can use r and R²', h: `r sits between −1 and 1. The sign tells you the direction, the size tells you how tight. Square it and you get R², and if you multiply that by 100 you get a percentage. Say the whole sentence out loud: "R² is 0.64, so 64% of the variation in test scores is explained by the straight-line relationship with study hours." Half of that sentence is not worth any marks. All of it is.` }
    ],
    decide: [
      { when: 'Both are labels (categorical)', then: 'Two-way table. Work out percentages inside each group, then compare them.' },
      { when: 'Both are numbers (numerical)', then: 'Scatterplot. Describe direction, shape and tightness, then use r and R².' },

      { wrong: '"r is tiny, so nothing is going on."', why: 'r feels like a general strength meter for any kind of relationship.', right: 'r only measures straight lines. A strong curve can give you almost zero. Look at the plot before you trust the number.' },

  'bivariate-2': {
    hook: 'Your model says a 40-year-old will run 100 metres in negative time. The arithmetic is perfect. The thinking is not.',
    intuition: `Imagine laying a ruler across a cloud of dots and sliding it around until it sits as close to all of them as you can get.
      That is the least-squares line. Everything else in this topic is either building that line, checking a straight line was
      a sensible shape to use, or being careful about what you use it for.`,
    board: [
      { t: 'Build the slope out of the spreads', h: `m = r(s<sub>y</sub> ÷ s<sub>x</sub>) looks made up until you see what it does. The s<sub>y</sub> ÷ s<sub>x</sub> part converts one step of x-spread into one step of y-spread. Then multiplying by r flattens it off, because the relationship is not perfect. Weak relationship, flatter line. If r were exactly 1 the line would be as steep as the spreads allow. If r were 0 it would be flat, and the line would just predict the average every single time.` },
      { t: 'Pin the line down at the middle', h: `c = ȳ − m x̄ is just that same equation rearranged. Every least-squares line goes through the point of means, the balance point of the data. So you get the tilt from the spreads, then slide the line up or down until it sits on that point.` },
      { t: 'The slope is a prediction, not a promise', h: `"Each extra hour of study predicts about 3.2 more marks." That word <em>predicts</em> is doing real work. Not causes. Not exactly. Those two words are the difference between full marks and half of them.` },
      { t: 'Check the residuals before you believe any of it', h: `A residual is how wrong the line was at one point: what you measured, minus what the line said. Plot all of them. If they scatter randomly in a band around zero, a straight line was fine. If they bend into a curve, the real pattern was curved and your straight line is the wrong tool. It does not matter how good r looked.` },
      { t: 'Check where your prediction is standing', h: `Inside the range of x you actually measured, you are on solid ground. That is interpolation. Outside it, you are guessing that the pattern carries on into territory nobody ever looked at. That is extrapolation, and it is how you end up predicting negative sprint times.` }

    decide: [
      { when: 'You have r, both spreads and both means', then: 'Build the line. Slope first, then the intercept from the means.' },

      { when: 'You are asked whether a prediction can be trusted', then: 'Check x against the range you measured. Name it, then mention the residual plot.' }
    ],
    misconceptions: [
      { wrong: 'Working out predicted minus measured.', why: 'Both orders feel equally natural when you are under time pressure.', right: 'Measured comes first. Get it backwards and every sign flips, so "above the line" turns into "below the line".' },
      { wrong: 'Dividing s<sub>x</sub> by s<sub>y</sub>.', why: 'The formula looks symmetrical, so it is easy to write down the wrong way round.', right: 'The y spread goes on top. Then look at your answer and ask whether a slope that size makes sense for this data.' },

  'time-series': {
    hook: 'Ice-cream sales always jump in summer. So when December sales go up, has the business actually grown, or is it just December doing what December does?',
    intuition: `Anything measured over time is really three things stacked on top of each other. There is the long slow direction it is
      heading. There is the pattern that repeats every year. And there is random noise. The whole topic is about pulling those
      apart, because you cannot tell whether a business is growing until you take the calendar out of the numbers.`,
    board: [
      { t: 'Smooth it first, so you can see the direction', h: `A moving average swaps each value for the average of itself and its neighbours. The jumpy bits cancel out and the direction shows through. Use an odd number of values so the answer lands on a real time point. A 3-point mean centred at time 4 uses times 3, 4 and 5, and it belongs at time 4. Put it at time 3 and you have quietly slid your whole series sideways.` },
      { t: 'Compare each season to a normal one', h: `A seasonal index answers "how does this season compare to average?", written as a multiplier. 1.30 means this quarter usually runs 30% above the yearly average. 0.85 means 15% below. Over one full cycle they average out to 1, so four quarterly indexes add up to 4 and twelve monthly ones add up to 12. That is how you find a missing one.` },
      { t: 'Take the season out by dividing', h: `December sales of $130 000 with an index of 1.30 are really $100 000 of ordinary trading that happened to land in December. Divide, and now you can compare December against June honestly. Now the trend line has something sensible to work with.` },
      { t: 'Fit the line to the tidied-up numbers', h: `This is the step people skip. If you fit a line to the raw data, the line spends all its time fighting the seasonal zigzag. Take the season out first, then fit, and the line tells you the actual direction.` },
      { t: 'Predict, then put the season back', h: `Use the line to predict the period you want, then multiply by that period's index. And say what you assumed out loud: that the trend keeps going and the seasonal pattern holds. A forecast with no caveat loses a mark nearly every time.` }
    ],
    decide: [
      { when: 'Asked to smooth, or to find the direction', then: 'Moving mean or median with an odd number of terms, written at the centre.' },
      { when: 'Turning a raw figure into a comparable one', then: 'Divide by the seasonal index.' },
      { when: 'Turning a trend prediction into a real forecast', then: 'Multiply by the seasonal index, then say what you assumed.' },
      { when: 'Given all the indexes but one', then: 'They add to the number of seasons. Subtract to find the missing one.' }
    ],
    misconceptions: [
      { wrong: 'Multiplying by the index to take the season out.', why: 'Both operations use the same two numbers, so under pressure it is a coin flip.', right: 'Taking it out divides. Putting it back multiplies. Quick check: if the index is above 1, your tidied-up figure has to come out lower than the raw one.' },
      { wrong: '"Sales rise every December, so the trend is upward."', why: 'On the raw plot a repeating rise genuinely looks like growth.', right: 'If it repeats on the calendar it is the season, not the trend. The trend is whatever is left once you take the repetition away.' },
      { wrong: 'Writing a moving average at the first time in its window.', why: 'That is the natural reading order, left to right.', right: 'It goes in the middle. That is the entire reason for using an odd number of terms.' },
      { wrong: 'Building a one-off event into the seasonal pattern.', why: 'It shows up as a big deviation, and indexes are built from deviations.', right: 'A flood or a strike is random noise. It does not come back every year, so it must not go into the index.' }
    ],
    checkpoint: 'Quarterly indexes are Q1 0.80, Q2 0.95, Q3 1.45 and Q4 missing. Find Q4. Then take the season out of a Q3 figure of $87 000, and say in plain words what the answer means.'

  'sequences': {
    hook: 'Two phone plans. One adds $12 a month. The other goes up by 12% a month. In month one they look the same. By month twenty, one costs three times the other.',
    intuition: `Every sequence here does the exact same thing at every step. Either it <strong>adds</strong> the same amount each time,
      which draws a straight line of dots, or it <strong>times</strong> by the same number each time, which draws a curve that
      keeps getting steeper. Your first job on any question is working out which one you have, and you do that by testing both.`,
    board: [
      { t: 'Test for adding, then test for timesing', h: `Subtract each term from the next one. Same answer every time? It adds, so it is arithmetic, and that number is d. If the subtractions do not match, try dividing instead. Same answer every time? It times, so it is geometric, and that number is r. Do both tests. Do not guess from a glance.` },
      { t: 'Turn the percentage into a multiplier straight away', h: `This is where most marks disappear. "Goes up 8% a year" means times by 1.08. "Loses 18% a year" means you keep 82% of it, so times by 0.82. Write r = 1.08 or r = 0.82 down before you do anything else and you have wiped out the single most common mistake in the topic.` },
      { t: 'Count the steps, not the terms', h: `The formula has (n − 1) in it for a reason. Getting from term 1 to term 5 takes four steps, not five. Same idea with money: if a machine is worth $48 000 at the end of year 1 and you want the end of year 6, that is five drops in value, so the power is 5.` },
      { t: 'A recurrence needs a starting point', h: `t<sub>n+1</sub> = 0.82 t<sub>n</sub> on its own describes infinitely many sequences. It only becomes <em>yours</em> once you also say t<sub>1</sub> = 48 000. Write the starting value every time, or the answer is not finished.` },

      { when: 'It changes by a fixed amount (+$50, −3 kg)', then: 'Arithmetic. Use tₙ = t₁ + (n − 1)d.' },

  'earth-geometry': {
    hook: 'You leave Sydney at 9pm on Tuesday, fly for 14 hours, and land in Los Angeles at 6pm on Tuesday. You got there before you left.',
    intuition: `Two different ideas share this topic. One is measuring distance on a ball, where how far apart two places are depends

      Longitude ties them together. The same lines that say how far east you are also set your clock.`,
    board: [
      { t: 'Read the coordinates before you pick anything', h: `Same longitude means both places sit on the same line running north to south. Same latitude means they sit on the same ring running east to west. Which one matches decides your formula, so check it first, every single time.` },
      { t: 'Going north or south, every degree is worth the same', h: `The lines running north to south are all full circles around the Earth, all the same size. So one degree is about 111.2 km no matter where you are. Multiply 111.2 by the difference in latitude. Same side of the equator, subtract. Opposite sides, add, because you are crossing the middle.` },
      { t: 'Going east or west, degrees shrink as you go towards the poles', h: `Picture the rings around a globe. The one at the equator is huge. The one near the North Pole is tiny enough to step over. So one degree of longitude covers much less ground at 60° than it does at the equator. The cos θ does that shrinking for you. At the equator cos 0° = 1 and nothing shrinks. At 60°, cos 60° = 0.5, so distances halve.` },
      { t: 'Turn longitude into time', h: `360° in 24 hours works out to 15° per hour. Further east means further ahead. Real time zones are decided by governments rather than geometry, so questions usually hand you a UTC offset instead.` },
      { t: 'For any trip, go through UTC', h: `Trying to do the time difference and the flight time in one move is how people lose a whole day. Do it in three. Convert the departure to UTC. Add the flight time while you are in UTC. Convert to the destination's local time. Flight time is the same everywhere, so only the conversions need care. Then count the day changes.` }
    ],
    decide: [
      { when: 'The longitudes match', then: 'D = 111.2 × difference in latitude. No cosine anywhere.' },
      { when: 'The latitudes match', then: 'D = 111.2 × cos(latitude) × difference in longitude.' },
      { when: 'Converting a clock time between two places', then: 'Destination offset minus origin offset. Apply it, then check the date.' },
      { when: 'A trip with a flight time', then: 'Local, then UTC, add the flight, then local again. Never all at once.' }
    ],
    misconceptions: [
      { wrong: 'Subtracting latitudes that are on opposite sides of the equator.', why: 'Subtracting is what you normally do to find a difference.', right: '12°N to 27°S is 39° apart, not 15°. Sketch the equator between them and it becomes obvious.' },

    board: [
      { t: 'Match the rate to the period. Always. First.', h: `If interest is worked out monthly then i is the <em>monthly</em> rate and n counts <em>months</em>. 6% a year compounded monthly gives i = 0.06 ÷ 12 = 0.005, and 5 years gives n = 60. Write both down before you touch a formula. Almost every wrong answer in this topic starts with a yearly rate sitting next to a monthly n.` },
      { t: 'A is the total, not the interest', h: `A = P(1 + i)<sup>n</sup> tells you what the account is worth altogether. If the question asks how much interest you <em>earned</em>, you still have to take the original amount off. Read the question again before you write the last line.` },
      { t: 'The effective rate is how you compare two offers', h: `6% compounded monthly is a better deal for a saver than 6% compounded yearly, because the monthly one earns interest on its own interest eleven extra times. The effective rate turns any quoted rate into the true one-year growth, which is the only fair way to compare. Do not forget the "− 1" at the end. Without it you have the multiplier, not the rate.` },
      { t: 'On a loan, interest goes on first, then your payment comes off', h: `A<sub>n+1</sub> = (1 + i)A<sub>n</sub> − d. Read it left to right in that order. The bank adds a month of interest to what you owe, and then your repayment comes off what is left. Doing it the other way round makes the debt look smaller than it is. And carry the unrounded balance to the next line.` },
      { t: 'Use the annuity formula when you want the whole schedule at once', h: `If the question is "what repayment clears this loan in exactly 60 payments?", stepping through a recurrence sixty times is hopeless. The present-value annuity formula connects the amount borrowed straight to the repayment, so you rearrange for d. Watch the minus sign on the power. A plus there gives you a wrong answer that still looks perfectly reasonable.` }
    ],
    decide: [
      { when: 'A lump sum sitting there, nothing going in or out', then: 'A = P(1 + i)ⁿ.' },

      { when: 'A debt with regular payments, and you want the balance after a few', then: 'Step through the recurrence.' },
      { when: 'A debt with regular payments, and you want the payment itself', then: 'Present-value annuity formula, rearranged for d.' }
