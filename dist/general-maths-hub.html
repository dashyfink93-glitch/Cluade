      { wrong: 'Writing down A when the question wanted the interest.', why: 'A is the number the formula gives you, so it feels like the answer.', right: 'Interest is A − P. Underline what the question actually asked for before you start.' },
      { wrong: 'Rounding the balance to the nearest cent on every line.', why: 'Money comes in cents, so rounding to cents looks like the right thing to do.', right: 'Round the final answer only. Rounding every line piles up error across a long loan.' },
      { wrong: 'Using +n instead of −n in the annuity formula.', why: 'A negative power looks like a typo.', right: 'The negative power is what brings future payments back to today. Use +n and the answer is wrong but still believable, which is why this one so often slips through.' }
    ],
    checkpoint: 'A $20 000 loan charges 7.2% a year compounded monthly, with $400 repayments. Write down i, write down n for 5 years, and write the recurrence. Then say, without calculating, whether the first repayment takes more or less than $400 off the debt.'
  },

  'finance-2': {
    hook: 'Put away $200 a month for 30 years at 5% and you will have handed over $72 000. The account will hold about $166 000. The rest was never yours to deposit.',

      { t: 'Saving adds, borrowing subtracts', h: `A<sub>n+1</sub> = (1 + i)A<sub>n</sub> + d. Interest goes on first, then your deposit lands on top. That single plus sign is the whole difference from a loan, and it is worth saying to yourself each time. A loan takes money off the balance. A savings plan puts money on.` },

  'graphs-networks': {

      { t: 'Read a matrix as "how many lines from this row to this column"', h: `For an ordinary graph the matrix is symmetric, because a line joins both ways. The diagonal is zero unless there are loops. Add up a row and you have that dot's degree. Add up the whole thing and halve it and you have the number of lines.` },
      { t: 'Every line has two ends, so degrees count everything twice', h: `That gives you a fast way to count lines, and a free check on your own work. It also means the number of odd dots is always even. If you counted three, you counted wrong.` },

/* ── assets/js/lib/ui.js ── */
/** Shared UI behaviour: theme, nav state, and a few small render helpers. */



/* ---------------- Theme ---------------- */
const THEME_KEY = 'theme';
function initTheme() {
  const saved = get(THEME_KEY, null);
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.setAttribute('data-theme', saved);
  }
  const btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  const sync = () => {
    const dark = currentTheme() === 'dark';
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    btn.setAttribute('aria-pressed', String(dark));
  };
  btn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    set(THEME_KEY, next);
    sync();
  });
  sync();
}

function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/* ---------------- Nav ---------------- */
function markCurrentNav() {
  const here = location.pathname.split('/').pop() || '?p=home';
  document.querySelectorAll('.nav a').forEach(a => {
    const target = a.getAttribute('href').split('/').pop().split('#')[0];
    if (target === here) a.setAttribute('aria-current', 'page');
  });
}

/* ---------------- Render helpers ---------------- */

/**
 * A formula-book entry rendered as an inline chip. The chip expands to show what
 * each letter stands for, so a student meeting the formula mid-question does not
 * have to leave the page to find out what r or i means.
 */
function formulaChip(id) {
  const f = FORMULA_BY_ID[id];
  if (!f) return '';
  const expr = `<span class="formula-chip__label">Formula book</span>
    <span aria-label="${escapeHtml(f.aria)}">${f.expr}</span>`;
  if (!f.symbols || !f.symbols.length) {
    return `<a class="formula-chip" href="?p=formulas#f-${f.id}">${expr}</a>`;
  }
  return `<details class="formula-chip formula-chip--expandable">
    <summary>${expr}</summary>
    <div class="formula-chip__body">
      <p class="formula-item__symbols-title">What the letters mean</p>
      <dl class="symbols">
        ${f.symbols.map(x => `<div><dt>${escapeHtml(x.s)}</dt><dd>${escapeHtml(x.m)}</dd></div>`).join('')}
      </dl>
      <p class="mb-0"><a href="?p=formulas#f-${f.id}">Open on the formula sheet</a></p>
    </div>
  </details>`;
}
function tierPill(tier) {
  const label = tier.charAt(0).toUpperCase() + tier.slice(1);
  return `<span class="pill pill--${tier}">${label}</span>`;
}

/** Replaces the contents of `el` and moves focus there for screen-reader users. */
function swapPanel(el, html, { focus = false } = {}) {
  el.innerHTML = html;
  if (focus) {
    el.setAttribute('tabindex', '-1');
    el.focus({ preventScroll: true });
  }
}

/** Debounce for search-as-you-type. */
function debounce(fn, ms = 160) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function announce(message) {
  let live = document.getElementById('sr-announcer');
  if (!live) {
    live = document.createElement('div');
    live.id = 'sr-announcer';
    live.className = 'visually-hidden';
    live.setAttribute('aria-live', 'polite');
    live.setAttribute('aria-atomic', 'true');
    document.body.appendChild(live);
  }
  live.textContent = '';
  setTimeout(() => { live.textContent = message; }, 40);
}

/** Promote the webfont stylesheet from print to all, once the page is up. */
function enableWebfonts() {
  for (const link of document.querySelectorAll('link[data-fonts]')) link.media = 'all';
}
function boot() {
  enableWebfonts();
  initTheme();
  markCurrentNav();
}

/* ── assets/js/lib/tutor.js ── */
/**
 * "Ask a tutor" panel, backed by the artifact `sample` capability.
 *
 * The capability only exists when the page is open inside a Claude viewer. On a
 * plain static host (GitHub Pages, a local server, a file on a USB stick)
 * `window.claude` is absent, `use()` resolves null, and the panel never appears
 *. Everything else on the page works exactly the same.
 *
 * Model output is treated as untrusted text: it is escaped, then a small, fixed
 * set of formatting marks is applied. No HTML from the model ever reaches the DOM.
 */

const MAX_TURNS = 8;          // keeps the prompt small; older turns drop off
const SUGGESTIONS_SHOWN = 3;

/** Viewer-facing copy for each failure the capability can report. */
function messageFor(code) {
  switch (code) {
    case 'not_granted':
    case 'sampling_disabled':
    case 'not_declared':
    case 'capability_disabled':
    case 'capability_removed':
      return null;                    // hide the feature entirely
    case 'rate_limited':
      return 'Too many questions at once. Wait a moment and ask again.';
    case 'prompt_too_large':
      return 'That conversation got too long. Start a new one with the Clear button.';
    case 'session_expired':
      return 'Your session expired. Reload the page and ask again.';
    case 'refused':
      return 'The tutor could not answer that one. Try rephrasing it.';
    case 'cancelled':
      return null;
    case 'empty_completion':
    case 'upstream_error':
    case 'queue_overflow':
      return 'Something went wrong reaching the tutor. Try again.';
    default:
      return 'The tutor is unavailable right now.';
  }
}

/** Escapes, then applies a fixed, safe subset of markdown. */
function formatAnswer(text) {
  const esc = escapeHtml(text);
  const blocks = esc.split(/\n{2,}/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
      return `<ul>${lines.map(l => `<li>${inline(l.replace(/^\s*[-*]\s+/, ''))}</li>`).join('')}</ul>`;
    }
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) {
      return `<ol>${lines.map(l => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ''))}</li>`).join('')}</ol>`;
    }
    return `<p>${inline(lines.join('<br>'))}</p>`;
  });
  return blocks.join('');
}

function inline(s) {
  return s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');
}

/** The instruction and topic material every question is answered against. */
function framing(topic, teaching) {
  const targets = topic.targets.map(t => `- ${t}`).join('\n');
  const knowledge = topic.knowledge.map(k => `- ${k.term}: ${k.text}`).join('\n');
  const bank = topic.bank.map(b => `- ${b.rule}: ${b.use}`).join('\n');
  const errors = topic.errors.map(e => `- ${e}`).join('\n');
  const pitfalls = (teaching?.misconceptions || [])
    .map(m => `- Students often think: ${m.wrong} Correction: ${m.right}`).join('\n');

  return `You are a patient senior secondary mathematics teacher helping a student with
Queensland (QCAA) General Mathematics, Units 3 and 4. The student is working on this topic:

TOPIC: ${topic.title} (${topic.unit})
BIG IDEA: ${topic.bigIdea}

SKILLS IN THIS TOPIC:
${targets}

CORE KNOWLEDGE:
${knowledge}

FORMULAS AND METHODS AVAILABLE:
${bank}

MISTAKES THAT COST MARKS HERE:
${errors}
${pitfalls}

HOW TO ANSWER:
- Explain the reasoning, do not just state an answer. If the student asks you to do
  a calculation, show the substitution line by line.
- Use only methods that fit this syllabus. Students have a scientific calculator and
  the QCAA formula book; they do not have calculus or statistical software.
- Name the formula you are using, in the same words as the list above.
- Australian conventions: dollars, kilometres, degrees (not radians), and
  "practise" as the verb.
- Keep it to a few short paragraphs, or a short numbered list for a method.
- Plain text only. No headings, no tables, no LaTeX. Bold with **stars** if you must.
- If the question is outside this topic, answer briefly and say which topic it belongs to.`;
}

/**
 * Mounts the panel into `container`. Resolves to true if the tutor is available.
 * Safe to call when the capability is missing. It simply renders nothing.
 */
export async function mountTutor(container, topic, teaching) {
  if (!container) return false;

  let sample = null;
  try {
    sample = await globalThis.claude?.use?.('sample');
  } catch { sample = null; }
  if (typeof sample !== 'function') return false;

  const suggestions = [
    `Explain ${topic.title.toLowerCase()} to me like I have never seen it.`,
    'Give me a worked example and talk me through every step.',
    'What is the most common mistake here, and how do I avoid it?',
    'How do I know which formula to use?',
    'Give me a harder question on this, then check my reasoning.'
  ].slice(0, SUGGESTIONS_SHOWN);

  container.innerHTML = `
    <section class="tutor" aria-labelledby="tutor-heading">
      <div class="tutor__head">
        <h3 id="tutor-heading">Ask a tutor about ${escapeHtml(topic.title)}</h3>
        <button type="button" class="btn btn--ghost btn--sm" id="tutor-clear">Clear</button>
      </div>
      <p class="text-muted tutor__note">Answers come from Claude, using this topic's material. Check anything
        surprising against the worked example above. A tutor can be wrong.</p>
      <div class="chip-row" id="tutor-suggestions">
        ${suggestions.map((s, i) => `<button type="button" class="chip-btn" data-q="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
      </div>
      <div class="tutor__log" id="tutor-log" role="log" aria-live="polite" aria-label="Tutor conversation"></div>
      <form class="tutor__form" id="tutor-form">
        <label class="visually-hidden" for="tutor-input">Your question about ${escapeHtml(topic.title)}</label>
        <input type="text" id="tutor-input" autocomplete="off" placeholder="Ask anything about this topic&hellip;">
        <button class="btn btn--primary" type="submit" id="tutor-send">Ask</button>
        <button class="btn btn--ghost" type="button" id="tutor-stop" hidden>Stop</button>
      </form>
      <p class="feedback" id="tutor-error" role="status"></p>
    </section>`;

  const log = container.querySelector('#tutor-log');
  const form = container.querySelector('#tutor-form');
  const input = container.querySelector('#tutor-input');
  const send = container.querySelector('#tutor-send');
  const stop = container.querySelector('#tutor-stop');
  const errorEl = container.querySelector('#tutor-error');
  const suggestionRow = container.querySelector('#tutor-suggestions');

  let turns = [];
  let controller = null;

  function addBubble(role, html) {
    const el = document.createElement('div');
    el.className = `bubble bubble--${role}`;
    el.innerHTML = html;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function ask(question) {
    if (!question.trim() || controller) return;
    errorEl.textContent = '';
    suggestionRow.hidden = true;
    addBubble('you', `<p>${escapeHtml(question)}</p>`);
    const answerEl = addBubble('tutor', '<p class="tutor__thinking">Thinking&hellip;</p>');

    // The first turn carries the framing; later turns continue the conversation.
    const content = turns.length ? question : `${framing(topic, teaching)}\n\nSTUDENT'S QUESTION: ${question}`;
    const outgoing = [...turns, { role: 'user', content }].slice(-MAX_TURNS);

    controller = new AbortController();
    send.disabled = true;
    stop.hidden = false;
    input.value = '';

    try {
      const { text } = await sample(outgoing, {
        signal: controller.signal,
        modelTier: 'default',
        cache: false,
        onText: ({ text }) => { answerEl.innerHTML = formatAnswer(text); log.scrollTop = log.scrollHeight; }
      });
      answerEl.innerHTML = formatAnswer(text);
      turns = [...outgoing, { role: 'assistant', content: text }].slice(-MAX_TURNS);
    } catch (e) {
      const kept = e && e.text;
      if (kept) {
        answerEl.innerHTML = formatAnswer(kept);
      } else {
        answerEl.remove();
      }
      const msg = messageFor(e && e.code);
      if (msg) errorEl.textContent = msg;
      if (msg === null && e && e.code !== 'cancelled') container.innerHTML = '';   // capability withdrawn
    } finally {
      controller = null;
      send.disabled = false;
      stop.hidden = true;
      log.scrollTop = log.scrollHeight;
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
  stop.addEventListener('click', () => controller?.abort());
  suggestionRow.addEventListener('click', e => {
    const btn = e.target.closest('button[data-q]');
    if (btn) ask(btn.dataset.q);
  });
  container.querySelector('#tutor-clear').addEventListener('click', () => {
    turns = [];
    log.innerHTML = '';
    errorEl.textContent = '';
    suggestionRow.hidden = false;
    input.focus();
  });

  return true;
}

/** Mean and sample standard deviation of a list. */
function meanSd(v) {
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (v.length - 1)) || 1;
  return { mean, sd };
}

/**
 * Points whose sample statistics are the ones the question quotes.
 *
 * A plot that disagrees with its own summary table teaches the wrong thing, so
 * rather than scattering points near a line and hoping, this builds y from two
 * exactly uncorrelated pieces: the standardised x, weighted r, and independent
 * noise weighted sqrt(1 - r squared). The result has the stated means, standard
 * deviations and correlation, up to rounding for display.
 */
function scatterWithR(rng, { n = 10, xbar, sx, ybar, sy, r, dp = 1 }) {
  const rawX = Array.from({ length: n }, (_, i) =>
    (i - (n - 1) / 2) / ((n - 1) / 2) + rng.float(-0.25, 0.25, 3));
  const mx = meanSd(rawX);
  const zx = rawX.map(v => (v - mx.mean) / mx.sd);

  // Noise, then strip out whatever part of it points along x.
  let noise = Array.from({ length: n }, () => rng.float(-1, 1, 4));
  const dot = noise.reduce((a, v, i) => a + v * zx[i], 0);
  const zxSq = zx.reduce((a, v) => a + v * v, 0);
  noise = noise.map((v, i) => v - (dot / zxSq) * zx[i]);
  const mn = meanSd(noise);
  const zn = noise.map(v => (v - mn.mean) / mn.sd);

  const k = Math.sqrt(Math.max(0, 1 - r * r));
  return zx.map((z, i) => ({
    x: round(xbar + sx * z, dp),
    y: round(ybar + sy * (r * z + k * zn[i]), dp)
  })).sort((a, b) => a.x - b.x);
}

/** A quarterly series with a trend and a repeating seasonal shape. */
function seasonalSeries(rng, { quarters = 8, base, growth, indices }) {
  const values = [], labels = [], deseasonalised = [];
  for (let i = 0; i < quarters; i++) {
    const q = i % 4;
    const trend = base + growth * i;
    const v = round(trend * indices[q] * rng.float(0.97, 1.03, 3), 0);
    values.push(v);
    labels.push(`Y${Math.floor(i / 4) + 1} Q${q + 1}`);
    deseasonalised.push(round(v / indices[q], 0));
  }
  return { values, labels, deseasonalised };
}

/** Formats minutes-since-midnight as a 12-hour clock time. */
function clock(mins) {
  const m = ((mins % 1440) + 1440) % 1440;
  const h24 = Math.floor(m / 60), mm = m % 60;
  const suffix = h24 < 12 ? 'am' : 'pm';
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  const label = (h24 === 0 && mm === 0) ? '12:00 am (midnight)' : `${h12}:${String(mm).padStart(2, '0')} ${suffix}`;
  return label;
}
/** Day rollover: returns {dayShift, mins}. */
function shiftClock(mins, deltaMins) {
  const total = mins + deltaMins;
  const dayShift = Math.floor(total / 1440);
  return { dayShift, mins: ((total % 1440) + 1440) % 1440 };
}
function offsetLabel(off) {
  const sign = off < 0 ? '−' : '+';
  const a = Math.abs(off);
  const h = Math.floor(a), m = Math.round((a - h) * 60);
  return `UTC${sign}${h}${m ? ':' + String(m).padStart(2, '0') : ''}`;
}

  }

/* ── assets/js/data/questions/networks.js ── */
/**
 * Generators for Graphs and networks, and Networks and decision mathematics 1 & 2.
 * Diagrams are drawn as inline SVG (aria-hidden) and always paired with an
 * equivalent table, so nothing depends on being able to see the picture.
 */


/* Fixed layout reused by the weighted-network questions. */
const LAYOUT = { A: [42, 92], B: [150, 26], C: [150, 158], D: [286, 26], E: [286, 158], F: [396, 92] };
const EDGE_SET = [
  ['A', 'B'], ['A', 'C'], ['B', 'C'], ['B', 'D'], ['C', 'D'], ['C', 'E'], ['D', 'F'], ['E', 'F']
];

/** Inline SVG of a weighted undirected network. Decorative. The table carries the data. */
function networkSvg(edges, highlight = []) {
  const hi = new Set(highlight.map(e => [e.a, e.b].sort().join('')));
  const lines = edges.map(e => {
    const [x1, y1] = LAYOUT[e.a], [x2, y2] = LAYOUT[e.b];
    const on = hi.has([e.a, e.b].sort().join(''));
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor"
              stroke-width="${on ? 3.5 : 1.6}" opacity="${on ? 1 : .45}" />
            <rect x="${mx - 13}" y="${my - 11}" width="26" height="19" rx="5"
              fill="var(--surface)" stroke="currentColor" stroke-opacity=".25" />
            <text x="${mx}" y="${my + 3}" text-anchor="middle" font-size="12.5"
              font-weight="700" fill="currentColor">${e.w}</text>`;
  }).join('');
  const nodes = Object.entries(LAYOUT).map(([id, [x, y]]) =>
    `<circle cx="${x}" cy="${y}" r="17" fill="var(--surface)" stroke="currentColor" stroke-width="2" />
     <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="700"
       fill="currentColor">${id}</text>`).join('');
  return `<div style="margin-bottom:10px">
    <svg viewBox="0 0 440 190" width="440" height="190" role="presentation" aria-hidden="true"
      style="max-width:100%;height:auto;color:var(--text)">${lines}${nodes}</svg></div>`;
}

function edgeTable(edges) {
  return table(['Edge', ...edges.map(e => `${e.a}–${e.b}`)], [['Weight', ...edges.map(e => e.w)]]);
}

function randomWeightedNetwork(rng) {
  return EDGE_SET.map(([a, b]) => ({ a, b, w: rng.int(2, 14) }));
}

          { t: 'Apply the rule that follows',
            h: `<p>${effFloat === 0

          { t: 'State the conclusion',
            h: `<p class="mb-0">${effFloat === 0

        check: { type: 'open' }
      };
    }
  }
];

const networks2 = [
  {
    id: 'n2-cut-capacity', topicId: 'networks-2', tier: 'skill', marks: 2,
    skill: 'Calculate the capacity of a cut',
    gen(rng) {
      const fwd = [rng.int(4, 15), rng.int(3, 14), rng.int(2, 12)];
      const back = rng.int(3, 9);
      const cap = fwd.reduce((a, b) => a + b, 0);
      return {
        prompt: `<p>A cut in a flow network is crossed by four arcs: three directed <strong>from the source side to the sink side</strong> with capacities ${fwd.join(', ')}, and one directed <strong>back</strong> towards the source with capacity ${back}.</p>
                 <p class="mb-0">Calculate the capacity of the cut.</p>`,
        formulaIds: ['max-flow-min-cut'],
        steps: [
          { t: 'Recall which arcs count',
            h: `<p>A cut's capacity counts only the arcs directed <strong>forward</strong> across it. From the source side towards the sink side. Backward arcs contribute nothing.</p>` },
          { t: 'Add the forward capacities',
            h: `<p>${math(`${fwd.join(' <span class="op">+</span> ')} <span class="op">=</span> ${cap}`, `${fwd.join(' plus ')} equals ${cap}`)}</p>` },
          { t: 'Discard the backward arc',
            h: `<p class="mb-0">The arc of capacity ${back} runs back towards the source, so it is excluded. Cut capacity = <strong>${cap}</strong>.</p>` }
        ],
        answer: `Cut capacity = ${cap}.`,
        pitfall: 'Adding every arc that crosses the cut. Direction decides inclusion.',
        check: { type: 'number', value: cap, tol: 0.01, label: 'cut capacity' }
      };
    }
  },

  {
    id: 'n2-min-cut', topicId: 'networks-2', tier: 'apply', marks: 3,
    skill: 'Determine maximum flow from minimum cut',
    gen(rng) {
      const cuts = [
        { name: 'Cut 1', arcs: [rng.int(5, 12), rng.int(4, 11), rng.int(3, 9)] },

        { name: 'Cut 3', arcs: [rng.int(4, 10), rng.int(3, 9), rng.int(2, 8)] }
      ].map(c => ({ ...c, cap: c.arcs.reduce((a, b) => a + b, 0) }));
      const min = Math.min(...cuts.map(c => c.cap));
      const winner = cuts.find(c => c.cap === min);
      return {
        prompt: `<p>Three cuts separating the source from the sink in a flow network have these forward-arc capacities.</p>
          ${table(['Cut', 'Forward arc capacities'], cuts.map(c => [c.name, c.arcs.join(' + ')]))}
          <p class="mb-0">Determine the capacity of each cut and the maximum possible flow through the network.</p>`,
        formulaIds: ['max-flow-min-cut'],
        steps: [
          { t: 'Total each cut',
            h: table(['Cut', ...cuts.map(c => c.name)], [['Capacity', ...cuts.map(c => c.cap)]]) },
          { t: 'Identify the minimum',
            h: `<p>The smallest capacity is <strong>${min}</strong>, at ${winner.name}.</p>` },
          { t: 'Apply max-flow min-cut', formulaId: 'max-flow-min-cut',
            h: `<p>All flow from source to sink must cross every cut, so no cut can pass more than its own capacity. The maximum flow is therefore limited by the <em>smallest</em> cut: ${math(`maximum flow <span class="op">=</span> ${min}`)}.</p>` },
          { t: 'Note what still needs proving',
            h: `<p class="mb-0">To confirm ${min} is actually achievable, exhibit a feasible flow of ${min} through the network. A cut gives the upper bound; a matching flow proves the bound is reached.</p>` }

        answer: `Minimum cut = ${winner.name} with capacity ${min}; maximum flow = ${min}.`,
        pitfall: 'Choosing the cut with the fewest arcs rather than the smallest total capacity.',

    id: 'n2-assignment-2x2', topicId: 'networks-2', tier: 'skill', marks: 2,

/**
 * Registry for every question generator.
 *
 * A generator is a pure function of a seeded Rng, so `generate(id, seed)` always
 * rebuilds exactly the same question, which is what makes a question shareable
 * by URL and re-checkable later.
 */
const GENERATORS = [
  ...bivariate1, ...bivariate2, ...timeSeries,
  ...sequences, ...earthGeometry,
  ...finance1, ...finance2,
  ...graphsNetworks, ...networks1, ...networks2
];
const GENERATOR_BY_ID = Object.fromEntries(GENERATORS.map(g => [g.id, g]));
const TIERS = [
  { id: 'skill', label: 'Skill', blurb: 'Single-step recall and substitution. Do these without notes.' },
  { id: 'apply', label: 'Apply', blurb: 'Choose the method, then carry it through. Formula sheet allowed.' },
  { id: 'challenge', label: 'Challenge', blurb: 'Multi-step or interpretive. Treat these as timed exam responses.' }
];

/** Builds the full question for a generator id and seed. */
function generate(generatorId, seed) {
  const g = GENERATOR_BY_ID[generatorId];
  if (!g) throw new Error(`unknown generator: ${generatorId}`);
  const useSeed = (seed ?? randomSeed()) >>> 0;
  const body = g.gen(new Rng(useSeed));
  return {
    generatorId: g.id,
    seed: useSeed,
    topicId: g.topicId,
    tier: g.tier,
    marks: g.marks,
    skill: g.skill,
    shareId: `${g.id}.${useSeed}`,
    ...body
  };
}

/** Generators matching the current filters. */
function filterGenerators({ topics = [], tiers = [] } = {}) {
  return GENERATORS.filter(g =>
    (topics.length === 0 || topics.includes(g.topicId)) &&
    (tiers.length === 0 || tiers.includes(g.tier)));
}

/**
 * Random question honouring the filters.
 * `avoid` keeps the generator from repeating twice in a row when alternatives exist.
 */
function generateRandom({ topics = [], tiers = [], avoid = null, seed = null } = {}) {
  let pool = filterGenerators({ topics, tiers });
  if (pool.length === 0) return null;
  if (pool.length > 1 && avoid) {
    const trimmed = pool.filter(g => g.id !== avoid);
    if (trimmed.length) pool = trimmed;
  }
  const rng = new Rng(seed ?? randomSeed());
  return generate(rng.pick(pool).id, randomSeed());
}

/** Parses "generatorId.seed" back into a question. */
function fromShareId(shareId) {
  if (typeof shareId !== 'string') return null;
  const at = shareId.lastIndexOf('.');
  if (at < 1) return null;
  const id = shareId.slice(0, at);
  const seed = Number(shareId.slice(at + 1));
  if (!GENERATOR_BY_ID[id] || !Number.isFinite(seed)) return null;
  return generate(id, seed);
}

/** Count of generators per topic, for the topic cards. */
function generatorCounts() {
  const out = {};
  for (const g of GENERATORS) out[g.topicId] = (out[g.topicId] || 0) + 1;
  return out;
}

/* ── assets/js/lib/exam.js ── */
/**
 * Mock exam: paper construction, marking and grading.
 *
 * Only auto-markable question types are used (numeric and multiple choice), so a
 * paper can be marked without the student judging their own written response.
 */
const PAPER_LENGTH = 14;

/** Roughly the Skill/Apply/Challenge balance of a real combination-response paper. */
const TIER_MIX = { skill: 5, apply: 6, challenge: 3 };

/** Auto-markable generators only — an open written response cannot be marked by the page. */
const MARKABLE = GENERATORS.filter(g => {
  try { return generate(g.id, 12345).check.type !== 'open'; }
  catch { return false; }
});

/**
 * Builds a paper: the requested tier mix, spread as widely across the ten
 * topics as the mix allows, with no generator used twice.
 */
function buildPaper(seed = randomSeed()) {
  const rng = new Rng(seed);
  const chosen = [];
  const usedGenerators = new Set();
  const topicCount = Object.fromEntries(TOPICS.map(t => [t.id, 0]));

  for (const [tier, wanted] of Object.entries(TIER_MIX)) {
    for (let i = 0; i < wanted; i++) {
      const pool = MARKABLE.filter(g => g.tier === tier && !usedGenerators.has(g.id));
      if (!pool.length) break;
      // Prefer a topic that has come up least often so far.
      const fewest = Math.min(...pool.map(g => topicCount[g.topicId]));
      const best = pool.filter(g => topicCount[g.topicId] === fewest);
      const pick = rng.pick(best);
      usedGenerators.add(pick.id);
      topicCount[pick.topicId]++;
      chosen.push(pick);
    }
  }

  // Order the paper easiest-first, as a real paper broadly is.
  const order = { skill: 0, apply: 1, challenge: 2 };
  chosen.sort((a, b) => order[a.tier] - order[b.tier]);

  const questions = chosen.map((g, i) => ({
    ...generate(g.id, rng.int(1, 2 ** 30)),
    number: i + 1
  }));

  return {
    seed,
    questions,
    totalMarks: questions.reduce((n, q) => n + q.marks, 0)
  };
}

/** Grade bands, highest first. `min` is the lowest percentage in the band. */
const GRADE_BANDS = [
  { grade: 'A+', min: 95 }, { grade: 'A', min: 90 }, { grade: 'A−', min: 85 },
  { grade: 'B+', min: 80 }, { grade: 'B', min: 75 }, { grade: 'B−', min: 70 },
  { grade: 'C+', min: 65 }, { grade: 'C', min: 60 }, { grade: 'C−', min: 55 },
  { grade: 'D+', min: 50 }, { grade: 'D', min: 45 }, { grade: 'D−', min: 0 }
];
function gradeFor(percentage) {
  return GRADE_BANDS.find(b => percentage >= b.min) || GRADE_BANDS[GRADE_BANDS.length - 1];
}

/** Tone of the band, for styling only. */
function gradeTone(grade) {
  const letter = grade[0];
  return letter === 'A' || letter === 'B' ? 'good' : letter === 'C' ? 'fair' : 'poor';
}

/** Marks a single response. Numeric answers are all-or-nothing against the tolerance. */
function markResponse(question, response) {
  const c = question.check;
  if (response === null || response === undefined || response === '') {
    return { answered: false, correct: false, marks: 0 };
  }
  if (c.type === 'number') {
    const v = parseNumeric(response);
    if (v === null) return { answered: true, correct: false, marks: 0 };
    const correct = Math.abs(v - c.value) <= c.tol;
    return { answered: true, correct, marks: correct ? question.marks : 0 };
  }
  if (c.type === 'choice') {
    const correct = Number(response) === c.correct;
    return { answered: true, correct, marks: correct ? question.marks : 0 };
  }
  return { answered: true, correct: false, marks: 0 };
}

/** Accepts "$1 200", "1,200", "−45", "687 km" and similar. */
function parseNumeric(raw) {
  const cleaned = String(raw)
    .replace(/[−–—]/g, '-')
    .replace(/[$,\s%]/g, '')
    .replace(/(km|days?|hours?|hrs?|h|min|minutes?)$/i, '');
  const v = Number(cleaned);
  return Number.isFinite(v) ? v : null;
}

/** Marks a whole paper and summarises it by topic. */
function markPaper(paper, responses) {
  const results = paper.questions.map((q, i) => ({
    question: q,
    response: responses[i],
    ...markResponse(q, responses[i])
  }));

  const earned = results.reduce((n, r) => n + r.marks, 0);
  const percentage = paper.totalMarks ? (earned / paper.totalMarks) * 100 : 0;

  const byTopic = {};
  for (const r of results) {
    const t = (byTopic[r.question.topicId] ||= { earned: 0, total: 0, correct: 0, count: 0 });
    t.earned += r.marks;
    t.total += r.question.marks;
    t.count++;
    if (r.correct) t.correct++;
  }

  return {
    results,
    earned,
    total: paper.totalMarks,
    percentage,
    band: gradeFor(percentage),
    byTopic,
    unanswered: results.filter(r => !r.answered).length
  };
}

    /* ---------------- Tabs ---------------- */
    function wireTabs() {
      const tabs = [...panelEl.querySelectorAll('[role="tab"]')];
      if (!tabs.length) return;

      const select = tab => {
        for (const t of tabs) {
          const on = t === tab;
          t.setAttribute('aria-selected', String(on));
          t.tabIndex = on ? 0 : -1;
          document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
        }
      };

      panelEl.querySelector('.tabs').addEventListener('click', e => {
        const tab = e.target.closest('[role="tab"]');
        if (tab) select(tab);
      });

      panelEl.querySelector('.tabs').addEventListener('keydown', e => {
        const i = tabs.indexOf(document.activeElement);
        if (i === -1) return;
        let next = null;
        if (e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
        if (e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
        if (e.key === 'Home') next = tabs[0];
        if (e.key === 'End') next = tabs[tabs.length - 1];
        if (next) { e.preventDefault(); next.focus(); select(next); }
      });
    }

              </li>`).join('')}
            </ol>
            <div class="answer-box">
              <p class="answer-box__label">Answer</p>
              <p>${q.answer}</p>
            </div>
            <div class="callout callout--error mb-0">
              <p class="callout__title">Where marks get lost</p>
              <p class="mb-0">${escapeHtml(q.pitfall)}</p>
            </div>
          </div>
        </details>

        <div class="flex-row">
          <button class="btn btn--primary" type="button" id="next-btn">Next question</button>
          <button class="btn btn--ghost" type="button" id="same-btn">Another like this one</button>
          <button class="btn btn--ghost" type="button" id="copy-btn">Copy link to this question</button>
        </div>
      </article>`;

      wireQuestion(q);
    }

    /* ---------------- Answer checking ---------------- */
    function parseNumeric(raw) {
      const cleaned = String(raw)
        .replace(/[−–—]/g, '-')
        .replace(/[$,\s%]/g, '')
        .replace(/km|days|hours|hrs|h$/gi, '');
      const v = Number(cleaned);
      return Number.isFinite(v) ? v : null;
    }

    /** Presents the expected value the way the question asked for it. */
    function formatExpected(check) {
      const v = check.value;
      if (check.unit === '$') return money(v, Math.abs(v) >= 1000 ? 2 : 2);
      const dp = Number.isInteger(v) ? 0 : (Math.abs(v) < 0.01 ? 6 : 4);
      const text = num(v, dp).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
      return check.unit ? `${text} ${check.unit}` : text;
    }

    function settle(wasCorrect, message, cls) {
      const fb = document.getElementById('answer-feedback');
      if (fb) {
        fb.textContent = message;
        fb.className = `feedback feedback--${cls}`;
      }
      if (!answered) {
        answered = true;
        const s = stats.record(current.topicId, wasCorrect);
        paintStats(s);
      }
      document.getElementById('solution').open = true;
      announce(message);
    }

    function wireQuestion(q) {
      const af = document.getElementById('answer-form');

      if (af && q.check.type === 'number') {
        af.addEventListener('submit', e => {
          e.preventDefault();
          const input = document.getElementById('answer-input');
          const v = parseNumeric(input.value);
          if (v === null) {
            document.getElementById('answer-feedback').textContent = 'Enter a number to check.';
            return;
          }
          const ok = Math.abs(v - q.check.value) <= q.check.tol;
          settle(ok, ok
            ? 'Correct. Compare your working with the steps below.'
            : `Not quite. The answer is ${formatExpected(q.check)}. Work through the steps to find where it diverged.`,
            ok ? 'right' : 'wrong');
        });
      }

      if (af && q.check.type === 'choice') {
        af.addEventListener('submit', e => {
          e.preventDefault();
          const picked = af.querySelector('input[name="choice"]:checked');
          if (!picked) {
            document.getElementById('answer-feedback').textContent = 'Choose an option first.';
            return;
          }
          const idx = Number(picked.value);
          const ok = idx === q.check.correct;
          af.querySelectorAll('.options label').forEach(l => {
            const i = Number(l.dataset.idx);
            if (i === q.check.correct) l.classList.add('is-correct');
            else if (i === idx) l.classList.add('is-wrong');
          });
          af.querySelectorAll('input').forEach(i => { i.disabled = true; });
          settle(ok, ok ? 'Correct.' : 'Not quite. The correct option is highlighted.', ok ? 'right' : 'wrong');
        });
      }

      const selfMark = document.getElementById('self-mark');
      if (selfMark) {
        selfMark.addEventListener('click', e => {
          const btn = e.target.closest('button[data-mark]');
          if (!btn) return;
          const ok = btn.dataset.mark === '1';
          settle(ok, ok ? 'Recorded as correct.' : 'Recorded. Reread the steps and try a fresh one.', ok ? 'right' : 'wrong');
        });
      }

      document.getElementById('next-btn').addEventListener('click', () => nextQuestion());
      document.getElementById('same-btn').addEventListener('click', () => nextQuestion(q.generatorId));
      document.getElementById('copy-btn').addEventListener('click', async e => {
        const url = `${location.origin}${location.pathname}?p=practice&q=${encodeURIComponent(q.shareId)}`;
        try {
          await navigator.clipboard.writeText(url);
          e.target.textContent = 'Link copied';
          setTimeout(() => { e.target.textContent = 'Copy link to this question'; }, 2000);
        } catch {
          history.replaceState(null, '', `?p=practice&q=${encodeURIComponent(q.shareId)}`);
          e.target.textContent = 'Link is in the address bar';
        }
      });
    }

    /* ---------------- Flow ---------------- */
    function nextQuestion(sameGenerator = null) {
      const { topics, tiers } = activeFilters();
      if (!tiers.length) {
        region.innerHTML = `<div class="card"><p class="mb-0">Select at least one difficulty tier to generate a question.</p></div>`;
        return;
      }
      if (!filterGenerators({ topics, tiers }).length) {
        region.innerHTML = `<div class="card"><p class="mb-0">No question type matches that combination.
          Try adding a difficulty tier or choosing all topics.</p></div>`;
        return;
      }
      answered = false;
      const q = sameGenerator
        ? fromShareId(`${sameGenerator}.${(Math.random() * 4294967295) >>> 0}`)
        : generateRandom({ topics, tiers, avoid: current?.generatorId });
      current = q;
      render(q);
      history.replaceState(null, '', `?p=practice&q=${encodeURIComponent(q.shareId)}`);
      region.scrollIntoView({ block: 'nearest' });
      announce(`New ${q.tier} question on ${TOPIC_BY_ID[q.topicId].title}.`);
    }

    function paintStats(s) {
      document.getElementById('s-attempted').textContent = s.attempted;
      document.getElementById('s-accuracy').textContent =
        s.attempted ? `${Math.round(s.correct / s.attempted * 100)}%` : '–';
      document.getElementById('s-streak').textContent = s.streak;
    }

    form.addEventListener('submit', e => { e.preventDefault(); nextQuestion(); });
    topicSelect.addEventListener('change', () => nextQuestion());
    document.getElementById('reset-stats').addEventListener('click', () => {
      stats.reset();
      paintStats(stats.read());
      announce('Statistics reset.');
    });

    document.addEventListener('keydown', e => {
      if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'g' || e.key === 'G') { e.preventDefault(); nextQuestion(); }
      if (e.key === 's' || e.key === 'S') {
        const sol = document.getElementById('solution');
        if (sol) { e.preventDefault(); sol.open = !sol.open; }
      }
    });

    /* ---- Initial state: a shared question, a topic from the URL, or a fresh one ---- */
    const params = new URLSearchParams(location.search);
    const shared = params.get('q') && fromShareId(params.get('q'));
    const wantedTopic = params.get('topic');
    if (wantedTopic && TOPIC_BY_ID[wantedTopic]) topicSelect.value = wantedTopic;

    paintStats(stats.read());
    if (shared) { current = shared; render(shared); }
    else nextQuestion();
  },
  formulas() {
    /** Formula sheet: the official book, annotated, searchable, plus the printed pages. */




    boot();

    const root = document.getElementById('formula-root');
    const search = document.getElementById('formula-search');
    const status = document.getElementById('search-status');
    const scopeChips = document.getElementById('scope-chips');
    const sheetRoot = document.getElementById('official-sheet');

    let scope = 'all';   // all | official | derived

    document.getElementById('jump-nav').innerHTML = FORMULA_SECTIONS
      .map(s => `<a href="#s-${s.id}">${escapeHtml(s.title)}</a>`).join('');

    document.getElementById('formula-counts').innerHTML =
      `<strong>${OFFICIAL.length}</strong> formulas are printed on the official QCAA sheet. Every one of them is here.
       A further <strong>${DERIVED.length}</strong> standard results the syllabus expects you to know, but which the sheet does
       <em>not</em> print, are marked <span class="pill pill--derived">derived</span>.`;

    /* ---- The printed pages, rendered from the source PDF ---- */
    sheetRoot.innerHTML = FORMULA_BOOK_PAGES.map(p => `
      <figure class="sheet-page">
        <img src="${p.src}" alt="${escapeHtml(p.label)}. The same formulas are listed as searchable text below." loading="lazy" width="1406" height="1988">
        <figcaption>${escapeHtml(p.label)}</figcaption>
      </figure>`).join('');

    /* ---- Search ---- */
    /** Light stemming so "annuity" also finds "annuities" and "graph" finds "graphs". */
    function stem(text) {
      return text.toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .split(/\s+/)
        .filter(Boolean)
        .map(w => w.replace(/ies$/, 'y').replace(/(ses|xes|zes|ches|shes)$/, m => m.slice(0, -2)).replace(/([^s])s$/, '$1'))
        .join(' ');
    }

    function haystack(f) {
      const topics = f.topics.map(id => TOPIC_BY_ID[id]?.title || '').join(' ');
      const section = FORMULA_SECTIONS.find(s => s.id === f.section)?.title || '';
      return stem(`${f.name} ${f.use} ${f.aria} ${section} ${topics}`);
    }

    /** What each letter in the formula actually stands for. */
    function symbolsHtml(f) {
      if (!f.symbols || !f.symbols.length) return '';
      return `<div class="formula-item__symbols">
        <p class="formula-item__symbols-title">What the letters mean</p>
        <dl class="symbols">
          ${f.symbols.map(x => `<div>
            <dt>${escapeHtml(x.s)}</dt><dd>${escapeHtml(x.m)}</dd></div>`).join('')}
        </dl>
      </div>`;
    }

    function itemHtml(f) {
      const links = f.topics.map(id => {
        const t = TOPIC_BY_ID[id];
        return t ? `<a class="pill" href="?p=topics#${t.id}">${escapeHtml(t.title)}</a>` : '';
      }).join('');
      return `<article class="formula-item" id="f-${f.id}">
        <h3 class="formula-item__name">
          ${escapeHtml(f.name.replace(/ \(derived\)$/, ''))}
          ${f.derived ? '<span class="pill pill--derived">derived</span>' : ''}
        </h3>
        <p class="formula-item__expr"><span aria-label="${escapeHtml(f.aria)}">${f.expr}</span></p>
        <p class="formula-item__use">${escapeHtml(f.use)}</p>
        ${symbolsHtml(f)}
        ${links ? `<div class="formula-item__links">${links}</div>` : ''}
      </article>`;
    }

    function render(filter = '') {
      const q = filter.trim();
      const terms = stem(q).split(' ').filter(Boolean);
      const inScope = f => scope === 'all' || (scope === 'official' ? !f.derived : f.derived);
      const match = f => inScope(f) && (!terms.length || terms.every(t => haystack(f).includes(t)));

      let shown = 0;
      const html = FORMULA_SECTIONS.map(sec => {
        const items = FORMULAS.filter(f => f.section === sec.id && match(f));
        if (!items.length) return '';
        shown += items.length;
        return `<section class="formula-section" id="s-${sec.id}">
          <h2>${escapeHtml(sec.title)} <span class="pill">${items.length}</span>
            <span class="pill pill--page">sheet page ${sec.page}</span></h2>
          <p class="text-muted">${escapeHtml(sec.blurb)}</p>
          <div class="formula-list">${items.map(itemHtml).join('')}</div>
        </section>`;
      }).join('');

      root.innerHTML = html || `<p class="lead">Nothing matches &ldquo;${escapeHtml(filter)}&rdquo; in this view.
        Try a topic name, or widen the filter.</p>`;

      const scopeLabel = scope === 'all' ? '' : ` ${scope}`;
      status.textContent = q
        ? `${shown}${scopeLabel} formula${shown === 1 ? '' : 's'} match "${filter}".`
        : `Showing all ${shown}${scopeLabel} formulas.`;
    }

    /* ---- Scope filter ---- */
    scopeChips.addEventListener('change', e => {
      if (!e.target.name) return;
      scope = e.target.value;
      render(search.value);
      announce(status.textContent);
    });

    search.addEventListener('input', debounce(e => render(e.target.value), 150));
    render();

    /* ---- Deep links, e.g. ?p=formulas#f-annuity-pv ---- */
    function highlightTarget(retry = true) {
      document.querySelectorAll('.formula-item.is-target').forEach(el => el.classList.remove('is-target'));
      const id = location.hash.slice(1);
      if (!id || !id.startsWith('f-')) return;
      const el = document.getElementById(id);
      if (!el) {
        // The entry exists but the search or scope filter has hidden it. Reset and retry.
        if (retry && (search.value || scope !== 'all')) {
          search.value = '';
          scope = 'all';
          const allChip = scopeChips.querySelector('input[value="all"]');
          if (allChip) allChip.checked = true;
          render();
          highlightTarget(false);
        }
        return;
      }
      if (el.classList.contains('formula-item')) {
        el.classList.add('is-target');
        el.scrollIntoView({ block: 'center' });
      }
    }
    window.addEventListener('hashchange', highlightTarget);
    highlightTarget();
  },
  exam() {
    /** Mock exam: sit a paper, submit once, then read the marked result. */





    boot();

    const root = document.getElementById('exam-root');
    const startPanel = document.getElementById('exam-start');

    let paper = null;
    let responses = [];
    let current = 0;
    let startedAt = 0;
    let timerId = null;

    /* ---------------- Start screen ---------------- */
    function renderStart() {
      const best = get('examBest', null);
      startPanel.hidden = false;
      root.innerHTML = '';
      document.getElementById('best-result').innerHTML = best
        ? `Your best so far: <strong>${best.grade}</strong> &mdash; ${best.earned}/${best.total} marks
           (${num(best.percentage, 0)}%) on ${escapeHtml(best.date)}.`
        : 'You have not sat a paper yet.';
    }

    /* ---------------- Sitting the paper ---------------- */
    function startExam() {
      paper = buildPaper();
      responses = new Array(paper.questions.length).fill('');
      current = 0;
      startedAt = Date.now();
      startPanel.hidden = true;
      renderQuestion();
      timerId = setInterval(updateTimer, 1000);
      announce(`Mock exam started. ${paper.questions.length} questions, ${paper.totalMarks} marks.`);
    }

    function elapsed() {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function updateTimer() {
      const el = document.getElementById('exam-timer');
      if (el) el.textContent = elapsed();
    }

    function paletteHtml() {
      return `<ol class="palette" aria-label="Question navigation">
        ${paper.questions.map((q, i) => `<li>
          <button type="button" data-goto="${i}"
            class="palette__btn ${i === current ? 'is-current' : ''} ${responses[i] !== '' ? 'is-answered' : ''}"
            aria-current="${i === current}"
            aria-label="Question ${i + 1}${responses[i] !== '' ? ', answered' : ', not yet answered'}">${i + 1}</button>
        </li>`).join('')}
      </ol>`;
    }

    function responseFieldHtml(q, i) {
      if (q.check.type === 'choice') {
        return `<ul class="options">
          ${q.check.options.map((o, oi) => `<li><label>

      return `<div class="field" style="max-width:340px">
        <label for="response">Your answer: ${escapeHtml(q.check.label)}</label>

          value="${escapeHtml(String(responses[i]))}">

    function renderQuestion() {

      const answered = responses.filter(r => r !== '').length;

      root.innerHTML = `
        <div class="exam-bar">
          <div>
            <p class="exam-bar__label">Question ${current + 1} of ${paper.questions.length}</p>
            <div class="progress" role="img" aria-label="${answered} of ${paper.questions.length} questions answered">

          <button class="btn btn--primary" type="button" id="submit-btn">Submit paper</button>

        ${paletteHtml()}

        <article class="card card--pad-lg question-card">
          <div class="question-card__head">

        </article>

        <div class="flex-row">
          <button class="btn btn--ghost" type="button" id="prev-btn" ${current === 0 ? 'disabled' : ''}>Previous</button>
          <button class="btn btn--ghost" type="button" id="next-btn" ${current === paper.questions.length - 1 ? 'disabled' : ''}>Next</button>
        </div>`;

      wireQuestion();

    function captureResponse() {
      const form = document.getElementById('response-form');
      if (!form) return;
      const q = paper.questions[current];
      if (q.check.type === 'choice') {
        const picked = form.querySelector('input[name="response"]:checked');
        responses[current] = picked ? picked.value : '';
      } else {
        responses[current] = form.querySelector('#response').value.trim();
      }
    }

    function goTo(i) {
      captureResponse();
      current = Math.max(0, Math.min(paper.questions.length - 1, i));
      renderQuestion();
    }

    function wireQuestion() {
      document.getElementById('prev-btn').addEventListener('click', () => goTo(current - 1));
      document.getElementById('next-btn').addEventListener('click', () => goTo(current + 1));
      document.getElementById('submit-btn').addEventListener('click', confirmSubmit);
      root.querySelector('.palette').addEventListener('click', e => {

        if (btn) goTo(Number(btn.dataset.goto));

      const form = document.getElementById('response-form');
      form.addEventListener('submit', e => { e.preventDefault(); goTo(current + 1); });
      form.addEventListener('change', captureResponse);
      const first = form.querySelector('input');
      if (first && first.type === 'text') first.focus();

    document.getElementById('grade-bands').innerHTML = GRADE_BANDS.map(b => {
      const next = GRADE_BANDS[GRADE_BANDS.indexOf(b) - 1];
      const upper = next ? next.min - 1 : 100;
      return `<tr><th scope="row">${b.grade}</th><td>${b.min}${b.min === 0 ? '' : '–' + upper}${b.min === 0 ? ' – 44' : ''}%</td></tr>`;
    }).join('');
    document.getElementById('paper-length').textContent = PAPER_LENGTH;
    document.getElementById('start-btn').addEventListener('click', startExam);
    renderStart();

    window.addEventListener('beforeunload', e => {
      if (paper && timerId) { e.preventDefault(); e.returnValue = ''; }
    });
  }
};

/* ── dispatcher ──
   Page comes from ?p=; a bare ?q= (a shared question link) implies the
   practice page. Navigation between pages is an ordinary document load of
   this same file, so no client-side router is required. */
const params = new URLSearchParams(location.search);
let pageId = params.get('p');
if (!CONTROLLERS[pageId]) pageId = params.has('q') ? 'practice' : 'home';

document.getElementById('app-header').innerHTML = "<header class=\"site-header\">\n  <div class=\"wrap site-header__inner\">\n    <a class=\"brand\" href=\"?p=home\">\n      <span class=\"brand__mark\" aria-hidden=\"true\">∑</span>\n      <span>General Maths Hub\n        <span class=\"brand__sub\">QCAA Units 3 &amp; 4</span>\n      </span>\n    </a>\n    <nav class=\"nav\" aria-label=\"Main\">\n      <a href=\"?p=home\">Home</a>\n      <a href=\"?p=topics\">Learn</a>\n      <a href=\"?p=practice\">Practise</a>\n      <a href=\"?p=exam\">Mock exam</a>\n      <a href=\"?p=formulas\">Formula sheet</a>\n    </nav>\n    <button class=\"theme-toggle\" type=\"button\" aria-label=\"Switch theme\">\n      <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg>\n      <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/></svg>\n    </button>\n  </div>\n</header>";
document.getElementById('app-main').innerHTML = PAGE_SHELLS[pageId];
document.getElementById('app-footer').innerHTML = "<footer class=\"site-footer\">\n  <div class=\"wrap grid grid--3\">\n    <div>\n      <h2>General Maths Hub</h2>\n      <p>A free, open study site for QCAA General Mathematics Units 3 &amp; 4. No account, no tracking, no cost.</p>\n    </div>\n    <div>\n      <h2>Sections</h2>\n      <ul>\n        <li><a href=\"?p=topics\">Learning topics</a></li>\n        <li><a href=\"?p=practice\">Question generator</a></li>\n        <li><a href=\"?p=formulas\">Formula sheet</a></li>\n      </ul>\n    </div>\n    <div>\n      <h2>Attribution</h2>\n      <p>Formulas and topic structure follow the QCAA General Mathematics 2025 formula book and syllabus.\n        Formula book content: © State of Queensland (QCAA) 2025, licensed\n        <a href=\"https://creativecommons.org/licenses/by/4.0\" rel=\"license noopener\" target=\"_blank\">CC BY 4.0</a>.</p>\n      <p>This is an independent study resource and is not endorsed by or affiliated with the QCAA.</p>\n    </div>\n  </div>\n</footer>";
document.title = PAGE_TITLES[pageId];

CONTROLLERS[pageId]();

/* markCurrentNav() matches on filename, which cannot work here, so mark the
   active link ourselves — after the controller, so this is what sticks. */
for (const a of document.querySelectorAll('.nav a')) {
  a.removeAttribute('aria-current');
  if ((a.getAttribute('href') || '') === '?p=' + pageId) a.setAttribute('aria-current', 'page');
}
</script>
